<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agenda — Studio Luma Restivo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231FA97A'/><text x='50' y='70' font-size='58' font-family='sans-serif' fill='white' text-anchor='middle'>L</text></svg>">
<style>
/* ============ TOKENS ============ */
:root{
  --line:#dadce0; --line-soft:#e8eaed; --text:#3c4043; --muted:#5f6368;
  --accent:#1a73e8; --bg:#ffffff; --hover:#f1f3f4; --chip:#f8f9fa;
  --hour:52px; --gutter:60px; --radius:8px;
  --shadow-1:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --prof:#1FA97A; --prof-soft:#E4F6EF;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:"Google Sans","Product Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#dadce0;border-radius:10px;border:2px solid #fff}
::-webkit-scrollbar-thumb:hover{background:#bdc1c6}

/* ============ LOCK ============ */
#lock{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#ffffff 0%,#f4f8f7 55%,#eef4fb 100%);}
.lock-card{width:min(380px,90vw);background:#fff;border-radius:16px;padding:36px 30px;box-shadow:var(--shadow-2);text-align:center}
.lock-logo{width:56px;height:56px;border-radius:16px;background:var(--prof);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:26px;font-weight:600;margin:0 auto 18px}
.lock-card h1{font-size:19px;font-weight:500;margin:0 0 4px}
.lock-card p{font-size:13px;color:var(--muted);margin:0 0 22px}
.lock-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:10px}
.lock-card input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lock-card button{width:100%;margin-top:6px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:500;cursor:pointer}
.lock-card button:hover{filter:brightness(1.06)}
.lock-card button:disabled{opacity:.6;cursor:default}
.lock-err{color:#d93025;font-size:13px;margin-top:10px;min-height:18px;line-height:1.45}
.lock-foot{font-size:11px;color:#9aa0a6;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}

/* ============ SHELL DO CRM ============ */
#app{display:flex;height:100%}
#app[hidden]{display:none}
.rail{width:228px;flex-shrink:0;background:#fbfbfa;border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.rail-logo{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.rail-mark{width:36px;height:36px;border-radius:11px;background:var(--prof);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0}
.rail-logo b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.rail-logo span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.rail-nav{flex:1;overflow-y:auto;padding:4px 10px 10px}
.rail-sec{font-size:10px;color:#9aa0a6;text-transform:uppercase;letter-spacing:.6px;margin:14px 8px 6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;
  padding:9px 10px;border-radius:9px;font-size:13.5px;cursor:pointer;text-align:left;color:var(--text);
  margin-bottom:1px;position:relative}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--prof-soft);color:var(--prof);font-weight:600}
.nav-item svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85;flex-shrink:0}
.nav-item .bdg{margin-left:auto;font-size:10.5px;font-weight:700;background:#fce8e6;color:#c5221f;
  padding:1px 7px;border-radius:9px}
.nav-item.on .bdg{background:#fff}
.rail-user{border-top:1px solid var(--line-soft);padding:12px}
.rail-user .who{display:flex;align-items:center;gap:9px;margin-bottom:9px;min-width:0}
.rail-user .av{width:28px;height:28px;border-radius:50%;background:var(--prof);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.rail-user .who div{min-width:0;line-height:1.3}
.rail-user .who b{display:block;font-size:12.5px;font-weight:600}
.rail-user .who span{display:block;font-size:10.5px;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rail-user button{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:6px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.rail-user button:hover{background:var(--hover)}

.wrap{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.head{min-height:62px;display:flex;align-items:center;gap:10px;padding:10px 20px;
  border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
.head h1{font-size:19px;font-weight:500;margin:0;white-space:nowrap}
.head .sub{font-size:12px;color:var(--muted);margin-top:1px}
.mod{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.rolar{flex:1;overflow-y:auto;padding:20px}
.ico-btn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico-btn:hover{background:var(--hover)}
.ico-btn svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.btn-hoje{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:17px;background:#fff;
  font-size:13.5px;cursor:pointer;flex-shrink:0}
.btn-hoje:hover{background:var(--hover)}
.cal-title{font-size:17px;font-weight:400;white-space:nowrap}
.spacer{flex:1}
.view-switch{display:flex;border:1px solid var(--line);border-radius:17px;overflow:hidden;height:34px;flex-shrink:0}
.view-switch button{border:0;background:#fff;padding:0 14px;font-size:13.5px;cursor:pointer}
.view-switch button+button{border-left:1px solid var(--line)}
.view-switch button.on{background:var(--prof-soft);color:var(--prof);font-weight:500}
.view-switch button:hover:not(.on){background:var(--hover)}

/* painel interno da agenda */
.agenda{flex:1;display:flex;overflow:hidden}
.ag-side{width:216px;flex-shrink:0;border-right:1px solid var(--line-soft);padding:14px 12px;overflow-y:auto}
.ag-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.btn-criar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;
  border:0;border-radius:10px;background:var(--prof);color:#fff;font-size:13.5px;font-weight:500;
  cursor:pointer;margin-bottom:16px}
.btn-criar:hover{filter:brightness(1.06)}
.btn-criar svg{width:18px;height:18px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}

/* mini month */
.mini{margin-bottom:18px;user-select:none}
.mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding-left:6px}
.mini-head b{font-size:13px;font-weight:500}
.mini-nav{display:flex}
.mini-nav button{width:26px;height:26px;border:0;background:transparent;border-radius:50%;cursor:pointer;color:var(--muted);font-size:14px}
.mini-nav button:hover{background:var(--hover)}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.mini-grid .dow{font-size:9.5px;color:var(--muted);padding:3px 0}
.mini-grid button{border:0;background:transparent;height:26px;border-radius:50%;font-size:11.5px;cursor:pointer;color:var(--text)}
.mini-grid button:hover{background:var(--hover)}
.mini-grid button.out{color:#bdc1c6}
.mini-grid button.sel{background:var(--prof-soft);color:var(--prof);font-weight:600}
.mini-grid button.today{background:var(--accent);color:#fff;font-weight:600}
.mini-grid button.dot{position:relative}
.mini-grid button.dot::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}

.side-title{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 8px 6px}
.cal-list{list-style:none;margin:0 0 14px;padding:0}
.cal-list li{display:flex;align-items:center;gap:9px;padding:6px;border-radius:6px;font-size:12.5px;cursor:pointer}
.cal-list li:hover{background:var(--hover)}
.cbox{width:15px;height:15px;border-radius:3px;border:2px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cbox svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.cbox.on svg{opacity:1}

/* ============ GRID SEMANA/DIA ============ */
.grid-head{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
.gutter-head{width:var(--gutter);flex-shrink:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 6px 0;font-size:10px;color:var(--muted)}
.head-cols{flex:1;display:flex}
.head-col{flex:1;text-align:center;padding:8px 0 6px;border-left:1px solid var(--line-soft);min-width:0}
.head-col .dw{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.head-col .dn{font-size:24px;font-weight:400;line-height:1.3;width:40px;height:40px;margin:2px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.head-col.today .dw{color:var(--accent)}
.head-col.today .dn{background:var(--accent);color:#fff}
.head-col .pf{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:2px}

.grid-body{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;position:relative}
.gutter{width:var(--gutter);flex-shrink:0;position:relative}
.gutter .hr{height:var(--hour);position:relative}
.gutter .hr span{position:absolute;right:8px;top:-7px;font-size:10px;color:var(--muted);background:#fff;padding:0 2px}
.cols{flex:1;display:flex;position:relative}
.col{flex:1;position:relative;border-left:1px solid var(--line-soft);min-width:0}
.col.weekend{background:#fcfcfc}
.slot{height:var(--hour);border-bottom:1px solid var(--line-soft);cursor:pointer}
.slot:hover{background:rgba(26,115,232,.045)}
.now-line{position:absolute;left:0;right:0;height:0;border-top:2px solid #ea4335;z-index:6;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:#ea4335}

/* eventos */
.ev{position:absolute;border-radius:6px;padding:3px 6px;font-size:11.5px;line-height:1.28;overflow:hidden;cursor:pointer;
  border-left:3px solid;z-index:3;transition:box-shadow .12s;touch-action:none}
.ev:hover{box-shadow:var(--shadow-1);z-index:5}
.ev b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t{opacity:.85;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .cap{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;margin-top:1px}
.ev.full{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 6px,transparent 6px 12px)}
.ev.cancel{opacity:.5;text-decoration:line-through}
.ev.short{padding-top:1px}
.ev.short .t{display:inline;margin-left:4px}
.ev.short b{display:inline}
.ev-resize{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.ev.drag{opacity:.75;box-shadow:var(--shadow-2);z-index:20}

/* ============ MÊS ============ */
.month{flex:1;display:flex;flex-direction:column;overflow:hidden}
.month-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.month-dow div{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:8px 0}
.month-body{flex:1;display:grid;overflow-y:auto}
.mrow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line-soft);min-height:96px}
.mcell{border-left:1px solid var(--line-soft);padding:2px 4px 4px;overflow:hidden;cursor:pointer}
.mcell:hover{background:#fafafa}
.mcell .num{text-align:center;font-size:12px;padding:4px 0 3px}
.mcell .num span{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%}
.mcell.today .num span{background:var(--accent);color:#fff;font-weight:600}
.mcell.out{background:#fafafa}
.mcell.out .num{color:#bdc1c6}
.mchip{display:flex;align-items:center;gap:5px;font-size:11px;padding:2px 5px;border-radius:4px;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mchip i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mmore{font-size:11px;color:var(--muted);padding:1px 5px;cursor:pointer}
.mmore:hover{text-decoration:underline}

/* ============ AGENDA (lista) ============ */
.listv{flex:1;overflow-y:auto;padding:8px 20px 60px}
.lday{display:flex;gap:18px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.lday-d{width:86px;flex-shrink:0;text-align:right}
.lday-d b{font-size:22px;font-weight:400;display:block}
.lday-d span{font-size:11px;color:var(--muted);text-transform:uppercase}
.lday-d.today b{color:var(--accent);font-weight:600}
.lday-e{flex:1;display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 8px;border-radius:6px;cursor:pointer}
.lrow:hover{background:var(--hover)}
.lrow i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lrow .h{color:var(--muted);width:96px;flex-shrink:0}
.lrow .n{font-weight:500}
.lrow .o{margin-left:auto;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:40px;text-align:center}

/* ============ MODAL / POPUP ============ */
.backdrop{position:fixed;inset:0;background:rgba(32,33,36,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;box-shadow:var(--shadow-2);width:min(520px,100%);max-height:90vh;overflow-y:auto}
.modal-top{display:flex;align-items:center;gap:8px;padding:10px 12px;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--line-soft)}
.modal-top h3{flex:1;font-size:15px;font-weight:500;margin:0}
.modal-b{padding:18px 20px 20px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.segs{display:flex;gap:8px;flex-wrap:wrap}
.seg{padding:7px 14px;border:1px solid var(--line);border-radius:18px;font-size:13px;cursor:pointer;background:#fff}
.seg.on{background:var(--prof-soft);border-color:var(--prof);color:var(--prof);font-weight:500}
.dows{display:flex;gap:6px}
.dows button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer}
.dows button.on{background:var(--prof);border-color:var(--prof);color:#fff;font-weight:600}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 20px}
.btn{padding:9px 22px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dan{color:#d93025;border-color:#f3c7c3}
.btn.dan:hover{background:#fce8e6}
.btn.sm{padding:6px 14px;font-size:13px}

/* detalhe */
.det-bar{height:6px;border-radius:12px 12px 0 0}
.det-h{padding:18px 20px 12px}
.det-h h2{font-size:19px;font-weight:500;margin:0 0 4px}
.det-h .sub{font-size:13px;color:var(--muted)}
.det-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:12px;margin-top:8px}
.det-s{padding:0 20px 16px}
.det-s h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;font-weight:500}
.vagas{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vbar{flex:1;height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.vbar i{display:block;height:100%;border-radius:4px}
.vtxt{font-size:12px;font-weight:600}
.al{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;background:var(--chip);margin-bottom:6px;font-size:13px}
.al .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
.al .nm{flex:1;min-width:0}
.al .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .nm span{font-size:11px;color:var(--muted)}
.tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:9px;text-transform:uppercase;letter-spacing:.3px}
.tag.fixa{background:#e6f4ea;color:#137333}
.tag.experimental{background:#fef7e0;color:#b06000}
.tag.reposicao{background:#e8f0fe;color:#1967d2}
.tag.falta{background:#fce8e6;color:#c5221f}
.tag.presente{background:#e6f4ea;color:#137333}
.mini-act.on-ok{background:#e6f4ea;color:#137333;font-weight:700}
.mini-act.on-bad{background:#fce8e6;color:#c5221f;font-weight:700}
.mini-act{border:0;background:transparent;cursor:pointer;width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:15px}
.mini-act:hover{background:var(--hover)}
.addal{display:flex;gap:8px}
.addal input{flex:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#323232;color:#fff;font-size:13px;
  padding:12px 20px;border-radius:8px;box-shadow:var(--shadow-2);z-index:300;opacity:0;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.load{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;transition:width .25s;z-index:400}

.hint{font-size:11.5px;color:var(--muted);margin-top:-6px;margin-bottom:12px;line-height:1.5}
.hide{display:none!important}

/* ============ IMPORTAÇÃO ============ */
.modal.wide{width:min(940px,100%)}
.modal.inline{width:100%;max-width:none;max-height:none;overflow:visible;box-shadow:none;border-radius:0;background:transparent}
.modal.inline>.modal-top{display:none}
.modal.inline>.modal-b{padding:0}
.modal.inline>.modal-f{display:none}
.modal.inline .det-bar{display:none}
.drop{border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--prof);background:var(--prof-soft)}
.drop svg{width:34px;height:34px;stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.drop b{display:block;margin:10px 0 4px;font-size:15px;font-weight:500}
.drop span{font-size:12.5px;color:var(--muted)}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps div{flex:1;height:4px;border-radius:3px;background:var(--line-soft)}
.steps div.on{background:var(--prof)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--chip);border-radius:10px;padding:11px 12px;text-align:center}
.kpi b{display:block;font-size:21px;font-weight:500;line-height:1.25}
.kpi span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.prev-wrap{max-height:340px;overflow:auto;border:1px solid var(--line-soft);border-radius:10px}
table.prev{width:100%;border-collapse:collapse;font-size:12px}
table.prev th{position:sticky;top:0;background:#f8f9fa;text-align:left;padding:8px 9px;font-weight:500;
  color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);z-index:1}
table.prev td{padding:7px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.prev tr.err{background:#fef4f3}
table.prev tr.dup{background:#fffdf2}
table.prev select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:11.5px;background:#fff}
.st{font-size:10px;font-weight:600;padding:2px 7px;border-radius:9px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.st.nova{background:#e6f4ea;color:#137333}
.st.dupl{background:#fef7e0;color:#b06000}
.st.erro{background:#fce8e6;color:#c5221f}
.bar{height:8px;border-radius:5px;background:var(--line-soft);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--prof);width:0;transition:width .2s}
.aviso{background:#fef7e0;border:1px solid #fde293;border-radius:8px;padding:10px 12px;font-size:12.5px;
  color:#7a5900;line-height:1.55;margin-bottom:14px}
.erro-box{background:#fce8e6;border:1px solid #f5c7c3;border-radius:8px;padding:10px 12px;font-size:12.5px;
  color:#8c1d18;line-height:1.55;margin-bottom:14px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* ============ PAINEL FINANCEIRO ============ */
.viz{
  --surface-1:#ffffff; --text-primary:#0b0b0b; --text-secondary:#52514e; --muted-ink:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7;
  --seq-450:#2a78d6; --seq-250:#86b6ef;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
}
.abas{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:3px}
.aba{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--muted)}
.aba:hover{background:#fff}
.aba.on{background:#fff;color:var(--prof);font-weight:600;box-shadow:var(--shadow-1)}
.hero{background:var(--chip);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.hero .rot{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.hero .num{font-size:40px;font-weight:500;line-height:1.15;margin:2px 0 2px;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.hero .sub{font-size:12.5px;color:var(--muted);line-height:1.5}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.card{border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px}
.card h5{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin:0 0 2px}
.card .cap{font-size:11.5px;color:#9aa0a6;margin:0 0 12px;line-height:1.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* colunas empilhadas */
.cols6{display:flex;align-items:flex-end;gap:10px;height:132px;padding-top:4px}
.cols6 .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative;height:100%}
.cols6 .seg{border-radius:4px 4px 0 0}
.cols6 .seg.b{border-radius:0}
.cols6 .lb{font-size:10px;color:var(--muted-ink);text-align:center;padding-top:6px;
  border-top:1px solid var(--baseline);margin-top:2px;font-variant-numeric:tabular-nums}
.cols6 .c:hover .tip{opacity:1;transform:translate(-50%,-6px)}
.tip{position:absolute;left:50%;bottom:100%;transform:translate(-50%,0);background:#202124;color:#fff;
  font-size:11px;line-height:1.5;padding:7px 10px;border-radius:7px;white-space:nowrap;pointer-events:none;
  opacity:0;transition:.14s;z-index:9;box-shadow:var(--shadow-1)}
/* barras horizontais */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:10px;font-size:12px}
.hbar .nm{color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{background:var(--line-soft);border-radius:4px;height:14px;overflow:hidden}
.hbar .fl{height:100%;border-radius:0 4px 4px 0;min-width:3px}
.hbar .vl{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.grp{font-size:11px;color:var(--muted-ink);margin:2px 0 7px;letter-spacing:.3px}
.grp+.hbars{margin-bottom:14px}
.lista-mini{display:flex;flex-direction:column;gap:7px;max-height:210px;overflow:auto}
.lm{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:7px 9px;border-radius:8px;background:var(--chip)}
.lm .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm b{font-weight:500}
@media(max-width:900px){.cards{grid-template-columns:1fr}.hero .num{font-size:32px}}

/* mobile */
.menu-btn{display:none}
.vs-ab{display:none}
@media(max-width:960px){
  :root{--gutter:44px}
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:80;transform:translateX(-100%);
    transition:transform .2s;box-shadow:var(--shadow-2);background:#fff}
  .rail.open{transform:none}
  .menu-btn{display:flex}
  .head{min-height:56px;padding:8px 12px;gap:6px}
  .head h1{font-size:16px}
  .head .sub{display:none}
  .rolar{padding:14px}
  .cards{grid-template-columns:1fr}
  .hero .num{font-size:32px}
  .agenda{flex-direction:column}
  .ag-side{display:none}
  .cal-title{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .btn-hoje{padding:0 11px;font-size:12.5px;height:32px}
  .ico-btn{width:32px;height:32px}
  .view-switch{height:32px}
  .view-switch button{padding:0 10px;font-size:12.5px}
  .vs-full{display:none}
  .vs-ab{display:inline}
  .spacer{display:none}
  .abas{width:100%;overflow-x:auto}
  .aba{white-space:nowrap;font-size:12.5px;padding:6px 11px}
  .lday-d{width:56px}
  .lrow .h{width:auto}
  .head-col .dn{font-size:19px;width:32px;height:32px}
  .mrow{min-height:74px}
  .mchip{font-size:9.5px;padding:1px 3px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  table.prev{font-size:11px}
  table.prev th,table.prev td{padding:6px 5px}
}

/* ---------- helpers de data ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const startWeek=d=>addDays(d,-d.getDay());
const sameDay=(a,b)=>iso(a)===iso(b);
const isToday=d=>sameDay(d,new Date());
const hm=t=>t?t.slice(0,5):"";
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m;};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}:00`;
const fmtH=t=>{const s=hm(t);return s.endsWith(":00")?s.slice(0,2)+"h":s;};

/* ---------- Supabase REST ---------- */
let KEY=CFG.SUPABASE_KEY;
const API =CFG.SUPABASE_URL+"/rest/v1/";
const AUTH=CFG.SUPABASE_URL+"/auth/v1/";
const H=()=>({apikey:KEY,Authorization:"Bearer "+(SES?SES.access_token:KEY),"Content-Type":"application/json"});

/* ---------- sessão / login ---------- */
let SES=null;
function lerSessao(){try{SES=JSON.parse(localStorage.getItem("sl_sessao")||"null");}catch(e){SES=null;}}
function gravarSessao(j,emailFallback){
  SES={access_token:j.access_token,refresh_token:j.refresh_token,
       expira_em:Date.now()+((j.expires_in||3600)*1000),
       email:(j.user&&j.user.email)||emailFallback||(SES&&SES.email)||""};
  localStorage.setItem("sl_sessao",JSON.stringify(SES));
}
function limparSessao(){SES=null;localStorage.removeItem("sl_sessao");}

async function authPost(path,body,retry=true){
  const r=await fetch(AUTH+path,{method:"POST",
    headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){
    // chave da API recusada -> tenta a chave reserva uma vez
    if(retry&&/api key/i.test(JSON.stringify(j))&&CFG.SUPABASE_KEY_ALT&&KEY!==CFG.SUPABASE_KEY_ALT){
      KEY=CFG.SUPABASE_KEY_ALT;return authPost(path,body,false);
    }
    const e=new Error(j.error_description||j.msg||j.message||j.error||("HTTP "+r.status));
    e.status=r.status;e.code=j.error_code||j.error;throw e;
  }
  return j;
}
const entrar  =async(email,senha)=>gravarSessao(await authPost("token?grant_type=password",{email,password:senha}),email);
const renovar =async()=>{
  if(!SES||!SES.refresh_token) throw new Error("sem sessão");
  gravarSessao(await authPost("token?grant_type=refresh_token",{refresh_token:SES.refresh_token}));
};
async function sair(){
  if(SES){try{await fetch(AUTH+"logout",{method:"POST",
    headers:{apikey:KEY,Authorization:"Bearer "+SES.access_token}});}catch(e){}}
  limparSessao();location.reload();
}
let pending=0;
function prog(on){
  pending+=on?1:-1;const el=document.getElementById("load");
  el.style.width=pending>0?"70%":"100%";
  if(pending<=0){pending=0;setTimeout(()=>el.style.width="0",300);}
}
async function req(path,opt={},retry=true){
  // renova o token antes de expirar
  if(SES&&SES.expira_em-Date.now()<60000){try{await renovar();}catch(e){}}
  prog(true);
  try{
    const r=await fetch(API+path,{...opt,headers:{...H(),...(opt.headers||{})}});
    if(r.status===401&&retry){
      try{await renovar();}catch(e){expirou();throw new Error("Sessão expirada");}
      return req(path,opt,false);
    }
    if(r.status===403){throw new Error("Sem permissão para esta agenda.");}
    if(!r.ok){const t=await r.text();throw new Error(t||r.status);}
    if(r.status===204)return null;
    const txt=await r.text();return txt?JSON.parse(txt):null;
  }finally{prog(false);}
}
function expirou(){limparSessao();alert("Sua sessão expirou. Entre novamente.");location.reload();}
const db={
  list:(t,q="select=*")=>req(`${t}?${q}`),
  insert:(t,row)=>req(t,{method:"POST",body:JSON.stringify(row),headers:{Prefer:"return=representation"}}),
  update:(t,id,row)=>req(`${t}?id=eq.${id}`,{method:"PATCH",body:JSON.stringify(row),headers:{Prefer:"return=representation"}}),
  remove:(t,id)=>req(`${t}?id=eq.${id}`,{method:"DELETE"})
};

function detectProf(){
  const q=new URLSearchParams(location.search).get("prof");
  if(q&&SLUGS.includes(q.toLowerCase()))return q.toLowerCase();
  const p=location.pathname.toLowerCase().replace(/[^a-z]/g,"");
  for(const s of SLUGS) if(p.includes("agenda"+s)) return s;
  return "luma";
}

  const el=document.getElementById("toast");el.textContent=msg;el.classList.add("on");

}

function initLock(){
  const p=detectProf(),c=CORES[p];
  document.getElementById("lockLogo").textContent=c.nome[0];
  document.getElementById("lockLogo").style.background=c.cor;
  document.documentElement.style.setProperty("--prof",c.cor);
  document.documentElement.style.setProperty("--prof-soft",c.soft);

  const emailIn=document.getElementById("email"),pinIn=document.getElementById("pin"),
        btn=document.getElementById("pinBtn"),err=document.getElementById("pinErr");
  emailIn.value=localStorage.getItem("sl_ultimo_email")||"";

  const go=async()=>{
    err.textContent="";btn.disabled=true;btn.textContent="Entrando…";
    try{
      const em=emailIn.value.trim().toLowerCase();
      await entrar(em,pinIn.value);
      localStorage.setItem("sl_ultimo_email",em);
      await abrirApp();
    }catch(e){
      limparSessao();
      err.textContent=msgErro(e);
      btn.disabled=false;btn.textContent="Entrar";pinIn.select();
    }
  };
  btn.onclick=go;
  [emailIn,pinIn].forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go();});

  lerSessao();
  if(SES){
    btn.disabled=true;btn.textContent="Abrindo…";
    abrirApp().catch(()=>{
      limparSessao();btn.disabled=false;btn.textContent="Entrar";
      (emailIn.value?pinIn:emailIn).focus();
    });
  }else (emailIn.value?pinIn:emailIn).focus();
}

function msgErro(e){
  const s=String((e&&e.message)||e).toLowerCase();
  if(s.includes("invalid login")||s.includes("invalid_grant")||s.includes("credential"))
    return "E-mail ou senha incorretos.";
  if(s.includes("api key"))          return "Chave do servidor recusada. Avise o Adilson.";
  if(s.includes("failed to fetch")||s.includes("networkerror")||s.includes("load failed"))
    return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  if(s.includes("email not confirmed")) return "Conta ainda não confirmada no Supabase.";
  if(s.includes("rate limit")||s.includes("too many"))
    return "Muitas tentativas seguidas. Espere um minuto e tente outra vez.";
  if(s.includes("nenhuma professora")) return e.message;
  return "Não consegui entrar: "+((e&&e.message)||e);
}

async function abrirApp(){
  const perfis=await db.list("sl_perfis","select=*");
  if(!perfis||!perfis.length)
    throw new Error("Esta conta não está ligada a nenhuma professora. Avise o Adilson.");

/* ---------- mantém a agenda em dia entre as professoras ---------- */
let tSync=null,sincronizando=false;
function podeSincronizar(){
  const a=document.activeElement;
  return !document.hidden
      && !document.querySelector(".backdrop")
      && !document.querySelector(".ev.drag")
      && !document.querySelector("#imp table.prev")     // prévia de importação aberta
      && !(a && a.matches && a.matches("input,select,textarea"));
}
async function sincronizar(){
  if(sincronizando||!podeSincronizar()||!navigator.onLine)return;
  sincronizando=true;
  const impressao=()=>JSON.stringify(S.aulas.map(a=>a.id+a.hora_inicio+a.dia_semana+a.data+a.titulo).sort())
                      +S.matriculas.length+S.excecoes.length+S.alunas.length;
  const antes=impressao();
  try{
    await loadAll();
    if(antes!==impressao()&&podeSincronizar()){render();toast("Agenda atualizada por outra professora.");}
  }catch(e){}
  sincronizando=false;
}
function ligarAtualizacaoAutomatica(){
  clearInterval(tSync);
  tSync=setInterval(sincronizar,90000);          // a cada 1min30
  window.addEventListener("focus",sincronizar);  // e sempre que volta pra aba
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)sincronizar();});
}

/* ---------- aviso de internet ---------- */
function ligarAvisoDeRede(){
  const pinta=()=>{
    let b=document.getElementById("semRede");
    if(navigator.onLine){if(b)b.remove();return;}
    if(b)return;
    b=document.createElement("div");b.id="semRede";
    b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:150;background:#c5221f;color:#fff;"+
      "font-size:13px;padding:8px 14px;text-align:center;box-shadow:var(--shadow-1)";
    b.textContent="Sem internet — o que você mudar agora não vai ser salvo. Reconecte e tente de novo.";
    document.body.appendChild(b);
  };
  window.addEventListener("online",()=>{pinta();sincronizar();});
  window.addEventListener("offline",pinta);
  pinta();
}

  toast("Preparando a cópia…");
  try{

           `backup-agenda-studio-luma-${hoje}.json`);

/* =====================================================================
   REGRAS DE NEGÓCIO
   ===================================================================== */
function aulasVisiveis(){
  return S.aulas.filter(a=>S.visible.has(a.professora));
}
function cancelada(aulaId,d){
  return S.excecoes.some(e=>e.aula_id===aulaId&&e.data===d);
}
function ocorrenciasDoDia(date){
  const d=iso(date), dw=date.getDay(), out=[];
  for(const a of aulasVisiveis()){
    let ok=false;
    if(a.tipo==="fixa"){
      ok = a.dia_semana===dw
        && (!a.vigencia_inicio || a.vigencia_inicio<=d)
        && (!a.vigencia_fim   || a.vigencia_fim>=d);
    }else{
      ok = a.data===d;
    }
    if(ok) out.push({aula:a,data:d,cancel:cancelada(a.id,d)});
  }
  return out.sort((x,y)=>toMin(x.aula.hora_inicio)-toMin(y.aula.hora_inicio)
                     || x.aula.professora.localeCompare(y.aula.professora));
}
function matriculasDe(aulaId,d){
  // ignora matrícula de aluna que já saiu do Studio (não pode segurar vaga)
  return S.matriculas.filter(m=>m.aula_id===aulaId&&m.ativo&&(!m.data||m.data===d)&&alunaById(m.aluna_id));
}

/* janela de horário da grade: encaixa a aula mais cedo e a mais tarde */
let JAN={ini:6,fim:22};
function calcularJanela(){
  let ini=CFG.HORA_INICIO,fim=CFG.HORA_FIM;
  for(const a of aulasVisiveis()){
    ini=Math.min(ini,Math.floor(toMin(a.hora_inicio)/60));
    fim=Math.max(fim,Math.ceil(toMin(a.hora_fim)/60));
  }
  JAN={ini:Math.max(0,ini),fim:Math.min(24,Math.max(fim,ini+1))};
}
function ocupacao(aulaId,d){return matriculasDe(aulaId,d).length;}
function alunaById(id){return S.alunas.find(a=>a.id===id);}
/* a aluna já está em outra aula que cai no mesmo horário nesse dia? */
function choqueDeHorario(alunaId,aula,d){
  const ini=toMin(aula.hora_inicio),fim=toMin(aula.hora_fim),dt=parseISO(d),conf=[];
  for(const o of S.aulas){
    if(o.id===aula.id)continue;
    const ocorre = o.tipo==="fixa"
      ? o.dia_semana===dt.getDay()
        && (!o.vigencia_inicio||o.vigencia_inicio<=d)
        && (!o.vigencia_fim||o.vigencia_fim>=d)
        && !cancelada(o.id,d)
      : o.data===d;
    if(!ocorre)continue;
    if(!(toMin(o.hora_inicio)<fim && toMin(o.hora_fim)>ini))continue;
    if(matriculasDe(o.id,d).some(m=>m.aluna_id===alunaId)) conf.push(o);
  }
  return conf;
}
function presencaDe(aulaId,alunaId,d){
  return S.presencas.find(p=>p.aula_id===aulaId&&p.aluna_id===alunaId&&p.data===d);
}

/* =====================================================================
   VIEW: GRADE (dia / semana)
   ===================================================================== */
function viewGrade(isDia){
  const wrap=document.createElement("div");
  wrap.style.cssText="flex:1;display:flex;flex-direction:column;overflow:hidden";
  const dias = isDia ? [new Date(S.anchor)] : Array.from({length:7},(_,i)=>addDays(startWeek(S.anchor),i));

  /* colunas: no modo dia da Luma, divide por professora */
  const splitProf = isDia && S.isLuma && S.visible.size>1 && window.innerWidth>=900;
  const colDefs = splitProf
    ? [...S.visible].sort((a,b)=>SLUGS.indexOf(a)-SLUGS.indexOf(b)).map(s=>({date:dias[0],prof:s}))
    : dias.map(d=>({date:d,prof:null}));

  /* cabeçalho */
  let head=`<div class="grid-head"><div class="gutter-head">${splitProf?"":"GMT-3"}</div><div class="head-cols">`;
  colDefs.forEach(cd=>{
    const d=cd.date;
    head+=`<div class="head-col ${isToday(d)?"today":""}">
      <div class="dw">${DOW3[d.getDay()]}</div>
      <div class="dn">${d.getDate()}</div>
      ${cd.prof?`<span class="pf" style="background:${CORES[cd.prof].soft};color:${CORES[cd.prof].cor}">${CORES[cd.prof].nome}</span>`:""}
    </div>`;
  });
  head+="</div></div>";

  /* corpo */
  const hours=JAN.fim-JAN.ini;
  let gut="";for(let i=0;i<=hours;i++){const h=JAN.ini+i;
    gut+=`<div class="hr"${i===hours?' style="height:0"':""}>${i?`<span>${pad(h)}:00</span>`:""}</div>`;}
  let cols="";
  colDefs.forEach((cd,ci)=>{
    let slots="";for(let i=0;i<hours;i++)slots+=`<div class="slot" data-ci="${ci}" data-h="${JAN.ini+i}"></div>`;
    cols+=`<div class="col ${[0,6].includes(cd.date.getDay())?"weekend":""}" data-col="${ci}">${slots}</div>`;
  });
  wrap.innerHTML=head+`<div class="grid-body"><div class="gutter">${gut}</div><div class="cols">${cols}</div></div>`;

  /* eventos */
  const colEls=wrap.querySelectorAll(".col");
  colDefs.forEach((cd,ci)=>{
    let occ=ocorrenciasDoDia(cd.date);
    if(cd.prof) occ=occ.filter(o=>o.aula.professora===cd.prof);
    layout(occ).forEach(o=>colEls[ci].appendChild(evEl(o,cd.date)));
  });

  /* linha do agora */
  const now=new Date();
  colDefs.forEach((cd,ci)=>{
    if(!isToday(cd.date))return;
    const m=now.getHours()*60+now.getMinutes();
    if(m<JAN.ini*60||m>JAN.fim*60)return;
    const line=document.createElement("div");line.className="now-line";
    line.style.top=((m-JAN.ini*60)/60*hourPx())+"px";
    colEls[ci].appendChild(line);
  });

  /* clique em slot vazio -> criar */
  wrap.querySelectorAll(".slot").forEach(sl=>{
    sl.onclick=e=>{
      const ci=+sl.dataset.ci,h=+sl.dataset.h;
      const rect=sl.getBoundingClientRect();
      const half=(e.clientY-rect.top)>rect.height/2?30:0;
      const cd=colDefs[ci];
      modalAula(null,{date:cd.date,hora:h*60+half,prof:cd.prof||undefined});
    };
  });
  enableDrag(wrap,colDefs);
  return wrap;
}

/* empacotamento de eventos sobrepostos (algoritmo de colunas) */
function layout(occ){
  const evs=occ.map(o=>({...o,s:toMin(o.aula.hora_inicio),e:toMin(o.aula.hora_fim)}))
               .sort((a,b)=>a.s-b.s||a.e-b.e);
  let groups=[],cur=[],curEnd=-1;
  evs.forEach(ev=>{
    if(cur.length&&ev.s>=curEnd){groups.push(cur);cur=[];curEnd=-1;}
    cur.push(ev);curEnd=Math.max(curEnd,ev.e);
  });
  if(cur.length)groups.push(cur);
  groups.forEach(g=>{
    const cols=[];
    g.forEach(ev=>{
      let i=0;while(cols[i]&&cols[i]>ev.s)i++;
      cols[i]=ev.e;ev.col=i;
    });
    const n=cols.length;g.forEach(ev=>ev.cols=n);
  });
  return evs;
}

function evEl(o,date){
  const a=o.aula,c=CORES[a.professora];
  const s=toMin(a.hora_inicio),e=toMin(a.hora_fim),dur=e-s;
  const HP=hourPx();
  const el=document.createElement("div");
  const oc=ocupacao(a.id,o.data),cheia=oc>=a.capacidade;
  el.className="ev"+(cheia?" full":"")+(o.cancel?" cancel":"")+(dur<=30?" short":"");
  el.style.top=((s-JAN.ini*60)/60*HP)+"px";
  el.style.height=Math.max(18,dur/60*HP-2)+"px";
  const w=100/o.cols;
  el.style.left=`calc(${o.col*w}% + 2px)`;
  el.style.width=`calc(${w}% - 5px)`;
  el.style.background=c.soft;el.style.color=shade(c.cor,-45);el.style.borderLeftColor=c.cor;
  el.dataset.aula=a.id;el.dataset.data=o.data;
  const capIco=`<span class="cap" style="color:${cheia?"#c5221f":shade(c.cor,-30)}">${oc}/${a.capacidade}${cheia?" · lotada":""}</span>`;
  el.innerHTML = dur<=30
    ? `<b>${fmtH(a.hora_inicio)} ${esc(a.titulo)}</b><span class="t">${oc}/${a.capacidade}</span>`
    : `<b>${esc(a.titulo)}</b><div class="t">${hm(a.hora_inicio)}–${hm(a.hora_fim)}${S.isLuma&&S.visible.size>1?" · "+c.nome:""}</div>${dur>=45?capIco:""}`;
  if(!o.cancel) el.insertAdjacentHTML("beforeend",'<div class="ev-resize"></div>');
  el.onclick=ev=>{ev.stopPropagation();if(!el.dataset.moved)modalDetalhe(a.id,o.data);};
  return el;
}

/* =====================================================================
   ARRASTAR / REDIMENSIONAR
   ===================================================================== */
function enableDrag(wrap,colDefs){
  let drag=null;
  wrap.addEventListener("pointerdown",e=>{
    const ev=e.target.closest(".ev");if(!ev||ev.classList.contains("cancel"))return;
    const resize=!!e.target.closest(".ev-resize");
    const aula=S.aulas.find(a=>a.id===ev.dataset.aula);if(!aula)return;
    const colsBox=wrap.querySelector(".cols");
    drag={ev,aula,resize,y0:e.clientY,x0:e.clientX,
          top0:parseFloat(ev.style.top),h0:parseFloat(ev.style.height),
          colsBox,colW:colsBox.getBoundingClientRect().width/colDefs.length,
          col0:[...wrap.querySelectorAll(".col")].indexOf(ev.parentElement),moved:false};
    ev.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener("pointermove",e=>{
    if(!drag)return;
    const dy=e.clientY-drag.y0,dx=e.clientX-drag.x0;
    if(!drag.moved&&Math.abs(dy)<4&&Math.abs(dx)<4)return;
    drag.moved=true;drag.ev.classList.add("drag");
    const HP=hourPx(),step=HP/4; // 15 min
    if(drag.resize){
      drag.ev.style.height=Math.max(step,Math.round((drag.h0+dy)/step)*step)+"px";
    }else{
      drag.ev.style.top=Math.max(0,Math.round((drag.top0+dy)/step)*step)+"px";
      const shift=Math.round(dx/drag.colW);
      const nc=Math.min(colDefs.length-1,Math.max(0,drag.col0+shift));
      drag.newCol=nc;
      drag.ev.style.transform=`translateX(${(nc-drag.col0)*drag.colW}px)`;
    }
  });
  const end=async e=>{
    if(!drag)return;const d=drag;drag=null;
    d.ev.classList.remove("drag");
    if(!d.moved)return;
    d.ev.dataset.moved="1";setTimeout(()=>delete d.ev.dataset.moved,300);
    const HP=hourPx();
    const newStart=Math.round(parseFloat(d.ev.style.top)/HP*60)+JAN.ini*60;
    const newDur =Math.max(15,Math.round((parseFloat(d.ev.style.height)+2)/HP*60));
    const patch={};
    if(d.resize){
      patch.hora_fim=fromMin(toMin(d.aula.hora_inicio)+newDur);
    }else{
      const dur=toMin(d.aula.hora_fim)-toMin(d.aula.hora_inicio);
      patch.hora_inicio=fromMin(newStart);
      patch.hora_fim=fromMin(newStart+dur);
      const cd=colDefs[d.newCol??d.col0];
      if(cd){
        if(d.aula.tipo==="fixa") patch.dia_semana=cd.date.getDay();
        else patch.data=iso(cd.date);
        if(cd.prof) patch.professora=cd.prof;
      }
    }
    try{
      const [row]=await db.update("sl_aulas",d.aula.id,patch);
      Object.assign(d.aula,row);
      toast("Horário atualizado.");
    }catch(err){toast("Não consegui salvar. Tente de novo.");}
    render();
  };
  wrap.addEventListener("pointerup",end);
  wrap.addEventListener("pointercancel",end);
}

function viewMes(){
  const wrap=document.createElement("div");wrap.className="month";
  const a=S.anchor,first=new Date(a.getFullYear(),a.getMonth(),1);

  const weeks=Math.ceil((first.getDay()+new Date(a.getFullYear(),a.getMonth()+1,0).getDate())/7);
  let h=`<div class="month-dow">${DOW3.map(d=>`<div>${d}</div>`).join("")}</div><div class="month-body">`;
  for(let w=0;w<weeks;w++){
    h+=`<div class="mrow">`;

        <div class="num"><span>${d.getDate()}</span></div>

        ${occ.length>3?`<div class="mmore" data-more="${iso(d)}">mais ${occ.length-3}</div>`:""}
      </div>`;

  wrap.querySelectorAll(".mchip").forEach(el=>el.onclick=e=>{e.stopPropagation();modalDetalhe(el.dataset.a,el.dataset.dd);});
  wrap.querySelectorAll(".mmore").forEach(el=>el.onclick=e=>{e.stopPropagation();S.anchor=parseISO(el.dataset.more);S.view="dia";render();});

  return wrap;
}

/* as telas grandes rodam embutidas no módulo; as pequenas continuam como janela */
function painel(alvo,html){
  if(!alvo) return openModal(html);
  alvo.innerHTML=html;
  const m=alvo.querySelector(".modal");
  if(m)m.classList.add("inline");
  return m;
}
const fechar=alvo=>()=>{ if(alvo) render(); else closeModal(); };

let escHandler=null;
function closeModal(){
  document.getElementById("modalRoot").innerHTML="";
  if(escHandler){document.removeEventListener("keydown",escHandler);escHandler=null;}
}
function openModal(html){
  const r=document.getElementById("modalRoot");
  r.innerHTML=`<div class="backdrop">${html}</div>`;
  r.querySelector(".backdrop").onclick=e=>{if(e.target.classList.contains("backdrop"))closeModal();};
  if(escHandler)document.removeEventListener("keydown",escHandler);
  escHandler=e=>{if(e.key==="Escape")closeModal();};
  document.addEventListener("keydown",escHandler);
  const foco=r.querySelector("input:not([type=file]),select,textarea");
  if(foco)setTimeout(()=>foco.focus(),40);
  return r.querySelector(".modal");
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);
  const f=(v)=>Math.max(0,Math.min(255,Math.round(v+(p<0?v*p/100:(255-v)*p/100))));
  return "#"+[f(n>>16),f((n>>8)&255),f(n&255)].map(v=>pad(v.toString(16))).join("");
}

/* ---------- criar / editar aula ---------- */

        </select></div>

        <div class="fld"><label>Término</label><input id="f_fim" type="time" step="300" value="${hm(fromMin(fim))}"></div>

      hora_fim:   m.querySelector("#f_fim").value+":00",
      capacidade:+m.querySelector("#f_cap").value||CFG.CAPACIDADE,
      sala:m.querySelector("#f_sala").value.trim()||null,
      obs:m.querySelector("#f_obs").value.trim()||null,
      vigencia_inicio:m.querySelector("#f_vi").value||iso(new Date())
    };
    if(toMin(row.hora_fim)<=toMin(row.hora_inicio)){toast("O término precisa ser depois do início.");return;}
    btnSalvar.disabled=true;btnSalvar.textContent="Salvando…";
    try{
      if(a){const [r]=await db.update("sl_aulas",a.id,row);Object.assign(a,r);}
      else {const [r]=await db.insert("sl_aulas",row);S.aulas.push(r);}
      closeModal();render();toast(a?"Aula atualizada.":"Aula criada.");
    }catch(e){
      console.error(e);toast(limparErro(e));

  if(a) m.querySelector("[data-del]").onclick=()=>{closeModal();modalExcluirAula(a.id);};

/* ---------- excluir aula sem apagar o passado ---------- */

      <h3>Tirar “${esc(a.titulo)}” da agenda</h3>

}

/* ---------- alunas ---------- */
const PLANOS=["1x","2x","3x","4x","5x","avulso","experimental"];
const DURACOES=[["mensal","Mensal",1],["trimestral","Trimestral",3],["semestral","Semestral",6]];
const FORMAS=[["pix","Pix"],["dinheiro","Dinheiro"],["debito","Cartão de débito"],
              ["credito","Cartão de crédito"],["wellhub","Wellhub"],["totalpass","TotalPass"],["outro","Outro"]];
const mesesDo   =t=>(DURACOES.find(d=>d[0]===t)||[])[2]||null;
const rotuloDur =t=>(DURACOES.find(d=>d[0]===t)||[])[1]||"";
const rotuloForma=f=>(FORMAS.find(x=>x[0]===f)||[])[1]||"";
/* flexão: padrão feminino, muda para masculino quando o cadastro diz M */
const gen=(al,fem,masc)=>(al&&al.genero==="M")?masc:fem;
const oAluno=al=>gen(al,"aluna","aluno");
const PARCEIROS=["wellhub","totalpass"];
function modalidades(){
  try{const l=JSON.parse(S.cfg.modalidades||"[]");return Array.isArray(l)&&l.length?l:["Pilates"];}
  catch(e){return ["Pilates"];}
}
const FORMA_CURTA={pix:"Pix",dinheiro:"Dinheiro",debito:"Débito",credito:"Crédito",
                   wellhub:"Wellhub",totalpass:"TotalPass",outro:"Outro"};
function tabelaPrecos(){
  try{return JSON.parse(S.cfg.tabela_precos||"{}");}catch(e){return {};}
}
/* preço de tabela: R$ por mês */
function precoTabela(tipo,freq){
  const t=tabelaPrecos();
  return (t[tipo]&&t[tipo][freq]!=null)?Number(t[tipo][freq]):null;
}
/* término = início + meses − 1 dia (mesma conta do banco) */
function fimDoPlano(inicio,tipo){
  const m=mesesDo(tipo);
  if(!inicio||!m)return null;
  const d=parseISO(inicio),f=new Date(d.getFullYear(),d.getMonth()+m,d.getDate());
  f.setDate(f.getDate()-1);
  return iso(f);
}
function diasPara(dataISO){
  if(!dataISO)return null;
  return Math.round((parseISO(dataISO)-parseISO(iso(new Date())))/86400000);
}
/* situação do plano da aluna */
function statusPlano(al){
  if(!al.plano_fim)return {classe:"sem",texto:"sem plano",dias:null};
  const d=diasPara(al.plano_fim),aviso=parseInt(S.cfg.dias_aviso_renovacao||"30",10);
  if(d<0)  return {classe:"vencido", texto:`vencido há ${-d} dia${-d>1?"s":""}`, dias:d};
  if(d<=aviso) return {classe:"vencendo",texto:`vence em ${d} dia${d>1?"s":""}`, dias:d};
  return {classe:"ok",texto:`até ${al.plano_fim.slice(8,10)}/${al.plano_fim.slice(5,7)}`,dias:d};
}
const rotuloPlano=p=>!p?"":(/^\d+x$/.test(p)?p+"/semana":p);
const fmtR$=v=>v==null?"":"R$ "+Number(v).toFixed(2).replace(".",",");


/* ---------- bloco de plano reaproveitado nos dois formulários ---------- */
function camposPlano(px,al){
  al=al||{};
  return `
    <div class="row3">
      <div class="fld"><label>Frequência</label><select id="${px}_plano">
        <option value="">—</option>${PLANOS.map(x=>`<option value="${x}"${al.plano===x?" selected":""}>${rotuloPlano(x)}</option>`).join("")}
      </select></div>
      <div class="fld"><label>Duração do plano</label><select id="${px}_dur">
        <option value="">—</option>${DURACOES.map(d=>`<option value="${d[0]}"${al.plano_tipo===d[0]?" selected":""}>${d[1]}</option>`).join("")}
      </select></div>
      <div class="fld"><label>Início do plano</label>
        <input id="${px}_ini" type="date" value="${al.plano_inicio||""}"></div>
    </div>
    <div class="row3">
      <div class="fld"><label>Valor por mês (R$)</label>
        <input id="${px}_valor" type="number" step="0.01" min="0" value="${al.valor??""}" placeholder="0,00"></div>
      <div class="fld"><label>Vence dia</label>
        <input id="${px}_venc" type="number" min="1" max="31" value="${al.vencimento??""}" placeholder="10"></div>
      <div class="fld"><label>Forma de pagamento</label><select id="${px}_forma">
        <option value="">—</option>${FORMAS.map(f=>`<option value="${f[0]}"${al.forma_pagamento===f[0]?" selected":""}>${f[1]}</option>`).join("")}
      </select></div>
    </div>
    <div class="aviso" id="${px}_resumo" style="display:none"></div>`;
}
function ligarCamposPlano(m,px){
  const g=id=>m.querySelector("#"+px+"_"+id);
  const atualizar=(mudouTabela)=>{
    const freq=g("plano").value,tipo=g("dur").value,ini=g("ini").value;
    if(mudouTabela){
      const pr=precoTabela(tipo,freq);
      if(pr!=null)g("valor").value=pr;
    }
    const meses=mesesDo(tipo),fim=fimDoPlano(ini,tipo),v=parseFloat(g("valor").value);
    const box=g("resumo");
    if(!tipo||!freq){box.style.display="none";return;}
    const partes=[`<b>${rotuloDur(tipo)} · ${rotuloPlano(freq)}</b>`];
    if(isFinite(v)&&v>0){
      partes.push(`${fmtBRL(v)} por mês`);
      if(meses>1)partes.push(`total <b>${fmtBRL(v*meses)}</b> em ${meses}x`);
    }
    if(fim)partes.push(`vai de <b>${ini.slice(8,10)}/${ini.slice(5,7)}</b> até <b>${fim.slice(8,10)}/${fim.slice(5,7)}/${fim.slice(0,4)}</b>`);
    else if(meses)partes.push(`<span style="opacity:.75">preencha o início para calcular o término</span>`);
    box.innerHTML=partes.join(" · ");
    box.style.display="";
  };
  ["plano","dur"].forEach(id=>g(id).onchange=()=>atualizar(true));
  ["ini","valor"].forEach(id=>g(id).oninput=()=>atualizar(false));
  atualizar(false);
}
const lerCamposPlano=(m,px)=>{
  const g=id=>m.querySelector("#"+px+"_"+id);
  const v=parseFloat(String(g("valor").value).replace(",","."));
  return {
    plano      :g("plano").value||null,
    plano_tipo :g("dur").value||null,
    plano_inicio:g("ini").value||null,
    valor      :isFinite(v)?v:null,
    vencimento :parseInt(g("venc").value,10)||null,
    forma_pagamento:g("forma").value||null
  };
};

    <div class="modal-f"><button class="btn" data-x>Fechar</button></div>
  </div>`);

  m.querySelector("#busca").oninput=e=>{

/* =====================================================================
   IMPORTAÇÃO DE ALUNAS EM LOTE (Excel / CSV)
   ===================================================================== */

/* ---- normalização ---- */
const semAcento=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const chave =s=>semAcento(s).toLowerCase().replace(/\s+/g," ").trim();
const chaveCol=s=>semAcento(s).toLowerCase().replace(/[^a-z0-9]/g,"");

const MAPA_COL={
  nome:"nome", nomecompleto:"nome", aluna:"nome", alunoa:"nome", aluno:"nome",
  whatsapp:"telefone", telefone:"telefone", celular:"telefone", fone:"telefone",
  tel:"telefone", contato:"telefone", zap:"telefone",
  plano:"plano", frequencia:"plano", frequencia1:"plano", pacote:"plano",
  valor:"valor", valorrs:"valor", valorr:"valor", mensalidade:"valor", preco:"valor",
  vencimento:"vencimento", vencimentodia:"vencimento", diavencimento:"vencimento",
  diadovencimento:"vencimento", venc:"vencimento",
  professora:"professora", prof:"professora", responsavel:"professora", instrutora:"professora",
  duracao:"plano_tipo", duracaodoplano:"plano_tipo", tipodeplano:"plano_tipo", planotipo:"plano_tipo",
  contrato:"plano_tipo",
  iniciodoplano:"plano_inicio", inicio:"plano_inicio", planoinicio:"plano_inicio",
  datadeinicio:"plano_inicio", inicioplano:"plano_inicio",
  formadepagamento:"forma_pagamento", formapagamento:"forma_pagamento", pagamento:"forma_pagamento",
  forma:"forma_pagamento",
  nascimento:"nascimento", datadenascimento:"nascimento", aniversario:"nascimento",
  observacao:"obs", observacoes:"obs", obs:"obs", anotacao:"obs", anotacoes:"obs"
};

function normPlano(v){
  const s=chave(v);if(!s)return null;
  const m=s.match(/^([1-7])\s*x/);            if(m) return m[1]+"x";
  const n=s.match(/^([1-7])\s*(vez|aula)/);   if(n) return n[1]+"x";
  if(s.startsWith("avuls"))    return "avulso";
  if(s.startsWith("experim"))  return "experimental";
  return String(v).trim().slice(0,40);
}
function normValor(v){
  if(v===null||v===undefined||v==="")return null;
  if(typeof v==="number")return isFinite(v)?Math.round(v*100)/100:null;
  let s=String(v).replace(/r\$/i,"").replace(/\s/g,"");
  if(s.includes(",")&&s.includes(".")) s=s.replace(/\./g,"").replace(",",".");
  else if(s.includes(","))             s=s.replace(",",".");
  const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN;
}
function normVenc(v){
  if(v===null||v===undefined||v==="")return null;
  const n=parseInt(String(v).replace(/\D/g,""),10);
  if(!isFinite(n))return NaN;
  return (n>=1&&n<=31)?n:NaN;
}
function normDur(v){
  const x=chave(v);if(!x)return null;
  if(x.startsWith("mens"))return "mensal";
  if(x.startsWith("tri")) return "trimestral";
  if(x.startsWith("sem")) return "semestral";
  if(/^1\s*m/.test(x))    return "mensal";
  if(/^3\s*m/.test(x))    return "trimestral";
  if(/^6\s*m/.test(x))    return "semestral";
  return undefined;
}
function normForma(v){
  const x=chave(v).replace(/[^a-z]/g,"");if(!x)return null;
  if(x.includes("pix"))return "pix";
  if(x.includes("dinheiro")||x.includes("especie"))return "dinheiro";
  if(x.includes("debito"))return "debito";
  if(x.includes("credito")||x.includes("cartao"))return "credito";
  if(x.includes("wellhub")||x.includes("gympass"))return "wellhub";
  if(x.includes("totalpass"))return "totalpass";
  return "outro";
}
function normData(v){
  if(v===null||v===undefined||v==="")return null;
  if(v instanceof Date&&!isNaN(v))return iso(v);
  if(typeof v==="number"&&isFinite(v)){                 // número de série do Excel
    const d=new Date(Math.round((v-25569)*86400000));
    return isNaN(d)?NaN:iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  }
  const t=String(v).trim();
  let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);           if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){const a=m[3].length===2?"20"+m[3]:m[3];return `${a}-${pad(+m[2])}-${pad(+m[1])}`;}
  return NaN;
}
function normProf(v){
  const s=chave(v);if(!s)return null;
  for(const sl of SLUGS) if(chave(CORES[sl].nome)===s||sl===s) return sl;
  return undefined; // desconhecida
}
function normTel(v){
  if(v===null||v===undefined||v==="")return null;
  return String(v).trim().slice(0,40);
}

/* ---- leitura de arquivo ---- */
function lerCSV(txt){
  txt=txt.replace(/^﻿/,"");
  const linha1=(txt.split(/\r?\n/)[0]||"");
  const sep=(linha1.split(";").length>linha1.split(",").length)?";":",";
  const linhas=[];let campo="",atual=[],aspas=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(aspas){
      if(c==='"'){ if(txt[i+1]==='"'){campo+='"';i++;} else aspas=false; }
      else campo+=c;
    }else{
      // aspas só abrem campo se vierem no começo dele; no meio são literais
      // (ex.: Vera "Verinha" Lopes)
      if(c==='"'&&campo==="")aspas=true;
      else if(c==='"')  campo+=c;
      else if(c===sep)  {atual.push(campo);campo="";}
      else if(c==="\n") {atual.push(campo);linhas.push(atual);atual=[];campo="";}
      else if(c==="\r") {}
      else campo+=c;
    }
  }
  if(campo!==""||atual.length){atual.push(campo);linhas.push(atual);}
  return linhas.filter(l=>l.some(x=>String(x).trim()!==""));
}

let SHEETJS=null;
async function carregarSheetJS(){
  if(SHEETJS)return SHEETJS;
  if(window.XLSX){SHEETJS=window.XLSX;return SHEETJS;}
  const fontes=[
    "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
    "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
    "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"
  ];
  for(const src of fontes){
    try{
      await new Promise((ok,falhou)=>{
        const s=document.createElement("script");
        s.src=src;s.onload=ok;s.onerror=falhou;
        setTimeout(()=>falhou(new Error("timeout")),9000);
        document.head.appendChild(s);
      });
      if(window.XLSX){SHEETJS=window.XLSX;return SHEETJS;}
    }catch(e){}
  }
  return null;
}

/* devolve matriz de linhas (array de arrays) */
async function lerArquivo(file){
  const nome=file.name.toLowerCase();
  if(nome.endsWith(".csv")||nome.endsWith(".txt")){
    return lerCSV(await file.text());
  }
  const X=await carregarSheetJS();
  if(!X) throw new Error(
    "Não consegui carregar o leitor de Excel (provavelmente a internet bloqueou). "+
    "Abra a planilha no Excel, use Arquivo → Salvar como → CSV UTF-8 e suba o CSV.");
  const wb=X.read(await file.arrayBuffer(),{type:"array",cellDates:true});
  // pega a primeira aba que tenha uma coluna "Nome"
  let melhor=null;
  for(const nomeAba of wb.SheetNames){
    const m=X.utils.sheet_to_json(wb.Sheets[nomeAba],{header:1,blankrows:false,defval:""});
    if(!m.length)continue;
    const temNome=m.slice(0,8).some(l=>l.some(c=>chaveCol(c)==="nome"));
    if(temNome){melhor=m;break;}
    if(!melhor)melhor=m;
  }
  return melhor||[];
}

/* ---- transforma a matriz em linhas prontas ---- */
function interpretar(matriz){
  // acha a linha de cabeçalho (a que tiver "nome")
  let iCab=-1;
  for(let i=0;i<Math.min(matriz.length,10);i++){
    if(matriz[i].some(c=>chaveCol(c)==="nome")){iCab=i;break;}
  }
  if(iCab<0) return {erroGeral:'Não achei a coluna "Nome" na planilha. Use o modelo do botão "Baixar modelo".'};

  const cab=matriz[iCab].map(c=>MAPA_COL[chaveCol(c)]||null);
  if(!cab.includes("nome")) return {erroGeral:'Não achei a coluna "Nome".'};

  const ignoradas=matriz[iCab].filter((c,i)=>!cab[i]&&String(c).trim()).map(c=>String(c).trim());
  const linhas=[];
  const vistosNaPlanilha=new Map();

  for(let i=iCab+1;i<matriz.length;i++){
    const bruta=matriz[i];
    if(!bruta||!bruta.some(c=>String(c).trim()!==""))continue;
    const o={_linha:i+1,erros:[],avisos:[]};
    cab.forEach((campo,j)=>{ if(campo) o[campo]=bruta[j]; });

    o.nome=String(o.nome??"").trim().replace(/\s+/g," ");
    if(!o.nome){
      o.erros.push("linha sem nome");
      // zera o resto para a prévia não tentar exibir dado cru
      o.telefone=o.plano=o.valor=o.vencimento=o.professora=o.obs=null;
      linhas.push(o);continue;
    }
    if(o.nome.length>120)o.nome=o.nome.slice(0,120);

    o.telefone = normTel(o.telefone);
    o.plano    = normPlano(o.plano);
    o.obs      = o.obs!=null&&String(o.obs).trim()?String(o.obs).trim().slice(0,500):null;

    const val=normValor(o.valor);
    if(Number.isNaN(val)){o.avisos.push("valor não numérico, ignorado");o.valor=null;} else o.valor=val;

    const vc=normVenc(o.vencimento);
    if(Number.isNaN(vc)){o.avisos.push("vencimento fora de 1–31, ignorado");o.vencimento=null;} else o.vencimento=vc;

    const dur=normDur(o.plano_tipo);
    if(dur===undefined){o.avisos.push(`duração "${String(o.plano_tipo).trim()}" não reconhecida, ignorada`);o.plano_tipo=null;}
    else o.plano_tipo=dur;

    const ini=normData(o.plano_inicio);
    if(Number.isNaN(ini)){o.avisos.push("início do plano em formato estranho, ignorado");o.plano_inicio=null;}
    else o.plano_inicio=ini;

    const nasc=normData(o.nascimento);
    if(Number.isNaN(nasc)){o.avisos.push("nascimento em formato estranho, ignorado");o.nascimento=null;}
    else o.nascimento=nasc;

    o.forma_pagamento=normForma(o.forma_pagamento);

    const pr=normProf(o.professora);
    if(pr===undefined){o.erros.push(`professora "${String(o.professora).trim()}" não existe`);o.professora=null;}
    else{
      o.professora=pr;
      if(pr&&!S.isLuma&&pr!==S.prof) o.erros.push(`é aluna da ${CORES[pr].nome} — você só pode importar as suas`);
    }

    // duplicada dentro da própria planilha
    const k=chave(o.nome);
    if(vistosNaPlanilha.has(k)) o.erros.push(`nome repetido na planilha (linha ${vistosNaPlanilha.get(k)})`);
    else vistosNaPlanilha.set(k,i+1);

    // já existe no sistema
    const ja=S.alunas.find(a=>chave(a.nome)===k);
    if(ja&&!o.erros.length){o.existente=ja;o.decisao="atualizar";}

    linhas.push(o);
  }
  return {linhas,ignoradas};
}

/* ---- modal ---- */
function modalImportar(alvo){
  let LINHAS=[],IGN=[];
  const m=painel(alvo,`<div class="modal wide">
    <div class="modal-top">
      <button class="ico-btn" data-x><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>

    </div>
    <div class="modal-b" id="imp">
      <div class="steps"><div class="on"></div><div></div><div></div></div>
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 16px">
        Suba a planilha com o cadastro das alunas — nome, WhatsApp, plano, valor, vencimento e professora.
        Você confere tudo na tela antes de gravar. ${S.isLuma?"":"<b>Você só consegue importar alunas da sua agenda.</b>"}
      </p>
      <button class="btn sm" data-modelo style="margin-bottom:14px">⬇ Baixar modelo de planilha</button>
      <div class="drop" id="drop">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        <b>Arraste a planilha aqui</b>
        <span>ou clique para escolher · aceita .xlsx, .xls e .csv</span>
      </div>
      <input type="file" id="arq" accept=".xlsx,.xls,.csv,.txt" style="display:none">
    </div>
  </div>`);
  m.querySelectorAll("[data-x]").forEach(b=>b.onclick=fechar(alvo));
  m.querySelector("[data-modelo]").onclick=baixarModelo;

  const box=m.querySelector("#imp"),drop=m.querySelector("#drop"),arq=m.querySelector("#arq");
  drop.onclick=()=>arq.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");
    if(e.dataTransfer.files[0])processar(e.dataTransfer.files[0]);};
  arq.onchange=()=>{if(arq.files[0])processar(arq.files[0]);};

  async function processar(file){
    drop.innerHTML='<b>Lendo a planilha…</b><span>'+esc(file.name)+'</span>';
    try{
      const matriz=await lerArquivo(file);
      const r=interpretar(matriz);
      if(r.erroGeral)throw new Error(r.erroGeral);
      if(!r.linhas.length)throw new Error("A planilha não tem nenhuma linha preenchida abaixo do cabeçalho.");
      LINHAS=r.linhas;IGN=r.ignoradas||[];
      etapaPreVia();
    }catch(e){
      drop.innerHTML=`<b style="color:#c5221f">Não consegui ler o arquivo</b>
        <span style="display:block;margin-top:6px">${esc(e.message||e)}</span>
        <span style="display:block;margin-top:10px;color:var(--accent)">clique para tentar outro arquivo</span>`;
    }
  }

  function contar(){
    const erro=LINHAS.filter(l=>l.erros.length).length;
    const dup =LINHAS.filter(l=>!l.erros.length&&l.existente).length;
    const nova=LINHAS.filter(l=>!l.erros.length&&!l.existente).length;
    return {erro,dup,nova,total:LINHAS.length};
  }

  function etapaPreVia(){
    const c=contar();
    box.innerHTML=`
      <div class="steps"><div class="on"></div><div class="on"></div><div></div></div>
      <div class="kpis">
        <div class="kpi"><b>${c.total}</b><span>linhas</span></div>
        <div class="kpi"><b style="color:#137333">${c.nova}</b><span>novas</span></div>
        <div class="kpi"><b style="color:#b06000">${c.dup}</b><span>já existem</span></div>
        <div class="kpi"><b style="color:${c.erro?"#c5221f":"var(--muted)"}">${c.erro}</b><span>com problema</span></div>
      </div>
      ${IGN.length?`<div class="aviso">Colunas que eu não reconheci e vou ignorar: <b>${esc(IGN.join(", "))}</b>.</div>`:""}
      ${c.dup?`<div class="aviso">
        <b>${c.dup} aluna(s) já estão cadastradas.</b> Decida o que fazer com cada uma na coluna da direita —
        ou aplique para todas de uma vez:
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn sm" data-todas="atualizar">Atualizar todas</button>
          <button class="btn sm" data-todas="manter">Manter como está</button>
          <button class="btn sm" data-todas="pular">Pular todas</button>
        </div></div>`:""}
      ${c.erro?`<div class="erro-box">As linhas marcadas em vermelho <b>não serão importadas</b>.
        Corrija na planilha e suba de novo, ou siga sem elas.</div>`:""}
      <div class="prev-wrap"><table class="prev">
        <thead><tr>
          <th style="width:34px">#</th><th>Nome</th><th>WhatsApp</th><th>Plano</th>
          <th>Valor</th><th>Venc.</th><th>Professora</th><th style="width:78px">Situação</th>
          <th style="width:150px">O que fazer</th>
        </tr></thead>
        <tbody>${LINHAS.map((l,i)=>linhaHTML(l,i)).join("")}</tbody>
      </table></div>
      <div class="modal-f" style="padding:16px 0 0">
        <button class="btn" data-voltar>Escolher outro arquivo</button>
        <button class="btn pri" data-go ${c.nova+c.dup?"":"disabled"}>Importar</button>
      </div>`;
    ligarPreVia();
  }

  function linhaHTML(l,i){
    const cls=l.erros.length?"err":(l.existente?"dup":"");
    const sit=l.erros.length?'<span class="st erro">erro</span>'
             :(l.existente?'<span class="st dupl">já existe</span>':'<span class="st nova">nova</span>');
    let acao="—";
    if(l.erros.length) acao=`<span style="color:#c5221f;font-size:11px">${esc(l.erros.join("; "))}</span>`;
    else if(l.existente) acao=`<select data-dec="${i}">
        <option value="atualizar"${l.decisao==="atualizar"?" selected":""}>Atualizar cadastro</option>
        <option value="manter"${l.decisao==="manter"?" selected":""}>Manter como está</option>

  function ligarPreVia(){
    box.querySelectorAll("[data-dec]").forEach(s=>s.onchange=()=>{LINHAS[+s.dataset.dec].decisao=s.value;});
    box.querySelectorAll("[data-todas]").forEach(b=>b.onclick=()=>{
      LINHAS.forEach(l=>{if(!l.erros.length&&l.existente)l.decisao=b.dataset.todas;});
      etapaPreVia();
    });
    box.querySelector("[data-voltar]").onclick=()=>{closeModal();modalImportar();};
    const go=box.querySelector("[data-go]");if(go)go.onclick=importar;
  }

  async function importar(){
    const novas =LINHAS.filter(l=>!l.erros.length&&!l.existente);
    const atuais=LINHAS.filter(l=>!l.erros.length&&l.existente&&l.decisao==="atualizar");
    const total =novas.length+atuais.length;
    box.innerHTML=`<div class="steps"><div class="on"></div><div class="on"></div><div class="on"></div></div>
      <p style="font-size:14px;margin:0 0 4px">Gravando ${total} registro(s)…</p>
      <div class="bar"><i id="pb"></i></div>
      <div id="pt" style="font-size:12px;color:var(--muted)">preparando…</div>`;
    const pb=box.querySelector("#pb"),pt=box.querySelector("#pt");
    let feitas=0;const falhas=[];
    const passo=(t)=>{pb.style.width=Math.round(feitas/Math.max(1,total)*100)+"%";pt.textContent=t;};

    const corpo=l=>({nome:l.nome,telefone:l.telefone,plano:l.plano,valor:l.valor,
                     vencimento:l.vencimento,obs:l.obs,professora:l.professora,
                     plano_tipo:l.plano_tipo,plano_inicio:l.plano_inicio,
                     forma_pagamento:l.forma_pagamento,nascimento:l.nascimento,
                     importado_em:new Date().toISOString()});

    // novas: tenta em bloco; se o bloco falhar, faz uma a uma para isolar o erro
    if(novas.length){
      passo("cadastrando alunas novas…");
      try{
        const r=await db.insert("sl_alunas",novas.map(corpo));
        (r||[]).forEach(x=>S.alunas.push(x));
        feitas+=novas.length;passo("cadastrando alunas novas…");
      }catch(e){
        for(const l of novas){
          try{const [x]=await db.insert("sl_alunas",corpo(l));S.alunas.push(x);}
          catch(err){falhas.push({linha:l._linha,nome:l.nome,motivo:limparErro(err)});}
          feitas++;passo(`cadastrando… (${feitas}/${total})`);
        }
      }
    }
    // atualizações, uma a uma
    for(const l of atuais){
      try{
        const b=corpo(l);
        Object.keys(b).forEach(k=>{if(b[k]===null&&k!=="professora")delete b[k];}); // não apaga o que já existe
        const [x]=await db.update("sl_alunas",l.existente.id,b);
        Object.assign(l.existente,x);
      }catch(err){falhas.push({linha:l._linha,nome:l.nome,motivo:limparErro(err)});}
      feitas++;passo(`atualizando… (${feitas}/${total})`);
    }

    await loadAll();renderRail();
    etapaFim(novas.length,atuais.length,falhas);
  }

  function etapaFim(nNovas,nAtual,falhas){
    const pulou =LINHAS.filter(l=>!l.erros.length&&l.existente&&l.decisao!=="atualizar").length;
    const comErro=LINHAS.filter(l=>l.erros.length);
    const okNovas=nNovas-falhas.filter(f=>!LINHAS.find(l=>l._linha===f.linha&&l.existente)).length;
    box.innerHTML=`<div class="steps"><div class="on"></div><div class="on"></div><div class="on"></div></div>
      <div style="text-align:center;padding:8px 0 18px">
        <div style="font-size:40px;line-height:1">${falhas.length||comErro.length?"⚠️":"✅"}</div>
        <h3 style="font-size:18px;font-weight:500;margin:8px 0 2px">Importação concluída</h3>
        <p style="font-size:13px;color:var(--muted);margin:0">A lista de alunas já está atualizada na agenda.</p>
      </div>
      <div class="kpis">
        <div class="kpi"><b style="color:#137333">${Math.max(0,okNovas)}</b><span>cadastradas</span></div>
        <div class="kpi"><b style="color:#1967d2">${nAtual-falhas.filter(f=>LINHAS.find(l=>l._linha===f.linha&&l.existente)).length}</b><span>atualizadas</span></div>
        <div class="kpi"><b style="color:var(--muted)">${pulou}</b><span>mantidas/puladas</span></div>
        <div class="kpi"><b style="color:${falhas.length+comErro.length?"#c5221f":"var(--muted)"}">${falhas.length+comErro.length}</b><span>não entraram</span></div>
      </div>
      ${(falhas.length+comErro.length)?`<div class="erro-box">
        <b>${falhas.length+comErro.length} linha(s) ficaram de fora.</b> Baixe o relatório, corrija na planilha e suba de novo —
        as que já entraram não vão duplicar.</div>
        <button class="btn sm" data-rel>⬇ Baixar relatório do que não entrou</button>`:""}
      <div class="modal-f" style="padding:16px 0 0">
        <button class="btn" data-outro>Importar outra planilha</button>
        <button class="btn pri" data-x>Fechar</button>
      </div>`;
    box.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
    box.querySelector("[data-outro]").onclick=()=>{closeModal();modalImportar();};
    const rel=box.querySelector("[data-rel]");
    if(rel) rel.onclick=()=>baixarRelatorio(comErro,falhas);
  }

  function baixarRelatorio(comErro,falhas){
    const linhas=[["Linha da planilha","Nome","Motivo"]];
    comErro.forEach(l=>linhas.push([l._linha,l.nome||"",l.erros.join(" | ")]));
    falhas.forEach(f=>linhas.push([f.linha,f.nome,f.motivo]));
    const csv="﻿"+linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
    baixar(new Blob([csv],{type:"text/csv;charset=utf-8"}),"alunas-nao-importadas.csv");
  }
}

function fecharAlunos(alvo){ if(alvo){render();} else {closeModal();modalAlunas();} }
function limparErro(e){
  let s=String((e&&e.message)||e);
  try{const j=JSON.parse(s);s=j.message||j.details||j.hint||s;}catch(_){}
  if(/row-level security/i.test(s))      return "sem permissão — essa agenda não é sua";
  if(/sl_aulas_sem_choque/i.test(s))     return "já existe uma aula desta professora começando nesse horário";
  if(/sl_matriculas_unica/i.test(s))     return "essa aluna já está nesta aula";
  if(/sl_alunas_nome_tam/i.test(s))      return "o nome ficou grande demais (máximo 120 caracteres)";
  if(/sl_alunas_obs_tam/i.test(s))       return "a observação ficou grande demais (máximo 1000 caracteres)";
  if(/sl_aulas_titulo_tam/i.test(s))     return "o título da aula ficou grande demais (máximo 80 caracteres)";
  if(/sl_vagas_esgotadas/i.test(s))      return "a turma já está com todas as vagas ocupadas";
  if(/duplicate key|unique/i.test(s))    return "já existe um registro igual";
  if(/violates check|check_violation/i.test(s)) return "algum campo está fora do formato esperado";
  if(/failed to fetch|networkerror|load failed/i.test(s))
    return "sem conexão com o servidor — a alteração NÃO foi salva";
  return s.slice(0,160);
}
function baixar(blob,nome){
  const a=document.createElement("a"),u=URL.createObjectURL(blob);
  a.href=u;a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},400);
}
function baixarModelo(){
  try{
    const bin=atob(MODELO_XLSX),arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    baixar(new Blob([arr],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),
           "Modelo-Alunas-Studio-Luma-Restivo.xlsx");
  }catch(e){
    const csv="﻿Nome;WhatsApp;Plano;Valor (R$);Vencimento (dia);Professora;Observação\r\n"+
              "Ana Paula Moreira;(11) 99812-4477;2x semana;260;10;Lara;Reabilitação de joelho direito\r\n";
    baixar(new Blob([csv],{type:"text/csv;charset=utf-8"}),"Modelo-Alunas.csv");
  }
}

/* ---------- utilidades ---------- */
const fmtBRL=v=>v==null||v===""?"—":"R$ "+Number(v).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d)\,)/g,".");
const mes1  =d=>new Date(d.getFullYear(),d.getMonth(),1);
const mesISO=d=>iso(mes1(d));
const mesFim=d=>new Date(d.getFullYear(),d.getMonth()+1,0);
const nomeMes=d=>MES[d.getMonth()][0].toUpperCase()+MES[d.getMonth()].slice(1)+" de "+d.getFullYear();

function telWhats(t){
  let d=String(t||"").replace(/\D/g,"");
  if(d.length<10)return null;                 // sem DDD não dá pra montar o link
  if(d.length===10||d.length===11)d="55"+d;
  return d;
}
const preencher=(tpl,v)=>String(tpl||"").replace(/\{(\w+)\}/g,(_,k)=>v[k]!=null?v[k]:"");
function abrirWhats(tel,msg){
  const n=telWhats(tel);
  if(!n){toast("Essa aluna está sem WhatsApp no cadastro.");return false;}
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg)}`,"_blank","noopener");
  return true;
}
function quandoTexto(d){
  const h=iso(new Date());
  if(iso(d)===h)return "hoje";
  if(iso(d)===iso(addDays(new Date(),1)))return "amanhã";
  return `${DOW[d.getDay()].toLowerCase()} (${pad(d.getDate())}/${pad(d.getMonth()+1)})`;
}
/* alunas que esta conta administra */
function minhasAlunas(){
  return S.isLuma?S.alunas:S.alunas.filter(a=>a.professora===S.prof);
}
async function salvarConfig(chave,valor){
  S.cfg[chave]=valor;
  try{
    await req("sl_config",{method:"POST",body:JSON.stringify({chave,valor,atualizado:new Date().toISOString()}),
      headers:{Prefer:"resolution=merge-duplicates,return=representation"}});
  }catch(e){toast(limparErro(e));}
}

/* ---------- saldo de reposição ---------- */
function saldoReposicao(alunaId,ref){
  const ini=mesISO(ref),fim=iso(mesFim(ref));
  const limite=Math.max(0,parseInt(S.cfg.reposicoes_por_mes||"2",10)||0);
  const faltas=S.presencas.filter(p=>p.aluna_id===alunaId&&p.status==="falta"&&p.data>=ini&&p.data<=fim).length;
  const usadas=S.matriculas.filter(m=>m.aluna_id===alunaId&&m.ativo&&m.tipo==="reposicao"
                                    &&m.data&&m.data>=ini&&m.data<=fim).length;
  const credito=Math.min(faltas,limite);
  return {faltas,limite,credito,usadas,saldo:Math.max(0,credito-usadas)};
}

function modalLembretes(dataRef,alvo){

            ${tel?"":"disabled title='Sem WhatsApp no cadastro'"}>

          <button class="ico-btn" data-nav="1"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
          <div class="kpi"><b>${occ.length}</b><span>aulas no dia</span></div>
          <div class="kpi"><b style="color:#137333">${total}</b><span>alunos para avisar</span></div>
          <div class="kpi"><b style="color:${semTel?"#c5221f":"var(--muted)"}">${semTel}</b><span>sem WhatsApp</span></div>

          :'<div class="empty">Nenhuma falta registrada em '+nomeMes(ref)+'.<br><span style="font-size:12px">As faltas aparecem aqui depois que você marcar o ✓ ao lado da aluna, dentro da aula.</span></div>'}
      </div>

    const rg=box.querySelector("[data-regra]");
    if(rg)rg.onclick=async()=>{

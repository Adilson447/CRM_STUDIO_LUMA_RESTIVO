function modalRecebimentos(alvo){
  let ref=new Date();
  const m=painel(alvo,`<div class="modal wide"><div id="rec"></div></div>`);
  desenhar();

  function dadosDoMes(){
    const comp=mesISO(ref),hoje=iso(new Date());
    return minhasAlunas().filter(a=>a.valor>0||S.pagamentos.some(p=>p.aluna_id===a.id&&p.competencia===comp))
      .map(al=>{
        const p=S.pagamentos.find(x=>x.aluna_id===al.id&&x.competencia===comp)||null;
        const venc=p?p.vencimento:(al.vencimento?iso(new Date(ref.getFullYear(),ref.getMonth(),
          Math.min(al.vencimento,mesFim(ref).getDate()))):null);
        const valor=p?Number(p.valor):Number(al.valor||0);
        const pago=!!(p&&p.pago_em);
        const atrasado=!pago&&venc&&venc<hoje;
        return {al,p,venc,valor,pago,atrasado};
      }).sort((a,b)=>(a.venc||"9").localeCompare(b.venc||"9")||a.al.nome.localeCompare(b.al.nome));
  }

  function desenhar(){
    const L=dadosDoMes(),comp=mesISO(ref);
    const previsto=L.reduce((s,x)=>s+x.valor,0);
    const recebido=L.filter(x=>x.pago).reduce((s,x)=>s+(Number(x.p.valor_pago??x.valor)),0);
    const atraso  =L.filter(x=>x.atrasado).reduce((s,x)=>s+x.valor,0);
    const semCob  =L.filter(x=>!x.p).length;
    document.getElementById("rec").innerHTML=`
      <div class="modal-top">
        <button class="ico-btn" data-x><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <h3>Recebimentos</h3>
        ${S.isLuma?'<button class="btn sm" data-modelo>Editar cobrança</button>':""}
        <button class="btn sm" data-csv>⬇ Planilha</button>
      </div>
      <div class="modal-b">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
          <button class="ico-btn" data-nav="-1"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <b style="flex:1;text-align:center;font-size:15px;font-weight:500">${nomeMes(ref)}</b>
          <button class="ico-btn" data-nav="1"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="kpis">
          <div class="kpi"><b>${fmtBRL(previsto)}</b><span>previsto</span></div>
          <div class="kpi"><b style="color:#137333">${fmtBRL(recebido)}</b><span>recebido</span></div>
          <div class="kpi"><b style="color:#b06000">${fmtBRL(previsto-recebido)}</b><span>em aberto</span></div>
          <div class="kpi"><b style="color:${atraso?"#c5221f":"var(--muted)"}">${fmtBRL(atraso)}</b><span>atrasado</span></div>
        </div>
        ${semCob?`<div class="aviso"><b>${semCob} aluno(s) ainda sem cobrança lançada neste mês.</b>
          Gerar cria uma linha para cada uma, com o valor e o vencimento do cadastro.
          <div style="margin-top:8px"><button class="btn sm pri" data-gerar>Gerar cobranças de ${nomeMes(ref).split(" de ")[0].toLowerCase()}</button></div></div>`:""}
        ${L.length?`<div class="prev-wrap"><table class="prev">
          <thead><tr><th>Aluno</th><th>Plano</th><th>Valor</th><th>Vence</th><th>Situação</th>
            <th style="width:190px"></th></tr></thead>
          <tbody>${L.map((x,i)=>{
            const c=x.al.professora?CORES[x.al.professora]:null;
            const sit=x.pago?`<span class="st nova">pago ${x.p.pago_em.slice(8,10)}/${x.p.pago_em.slice(5,7)}</span>`
                     :x.atrasado?'<span class="st erro">atrasado</span>'
                     :x.p?'<span class="st dupl">em aberto</span>':'<span style="color:var(--muted);font-size:11px">sem cobrança</span>';
            return `<tr class="${x.atrasado?"err":""}">
              <td><b>${esc(x.al.nome)}</b>${c?`<div style="font-size:10px;color:${c.cor};font-weight:600">${c.nome}</div>`:""}</td>
              <td>${esc(rotuloPlano(x.al.plano)||"—")}</td>
              <td><b>${fmtBRL(x.valor)}</b></td>
              <td>${x.venc?x.venc.slice(8,10)+"/"+x.venc.slice(5,7):"—"}</td>
              <td>${sit}</td>
              <td style="white-space:nowrap">
                ${x.p?(x.pago?`<button class="mini-act" data-desfaz="${x.p.id}" title="Desfazer baixa">↺</button>`
                             :`<button class="btn sm pri" data-pago="${x.p.id}">Recebi</button>
                               <button class="btn sm" data-cob="${x.al.id}" ${telWhats(x.al.telefone)?"":"disabled"}>Cobrar</button>`)
                       :`<button class="btn sm" data-uma="${x.al.id}">Lançar</button>`}
              </td></tr>`;}).join("")}</tbody></table></div>`
          :`<div class="empty">Ninguém com mensalidade cadastrada.<br>
             <span style="font-size:12px">Preencha <b>Valor</b> e <b>Vencimento</b> na tela Alunas
             (ou traga pela planilha) que os valores aparecem aqui.</span></div>`}
        <div class="hint" style="margin-top:12px">Isto é um controle de recebimento, não um sistema
          de cobrança: nada é debitado automaticamente. Você marca o que entrou.</div>
      </div>
      <div class="modal-f"><button class="btn" data-x>Fechar</button></div>`;
    ligar(L,comp);
  }

  async function lancar(alunas,comp){
    const linhas=alunas.map(al=>({aluna_id:al.id,competencia:comp,valor:Number(al.valor||0),
      vencimento:al.vencimento?iso(new Date(ref.getFullYear(),ref.getMonth(),
        Math.min(al.vencimento,mesFim(ref).getDate()))):null}));
    if(!linhas.length)return;
    try{
      const r=await db.insert("sl_pagamentos",linhas);
      (r||[]).forEach(x=>S.pagamentos.push(x));
      toast(linhas.length+" cobrança(s) lançada(s).");
    }catch(e){toast(limparErro(e));}
    desenhar();
  }

  function ligar(L,comp){
    const box=document.getElementById("rec");
    box.querySelectorAll("[data-x]").forEach(b=>b.onclick=fechar(alvo));
    box.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{
      ref=new Date(ref.getFullYear(),ref.getMonth()+ +b.dataset.nav,1);desenhar();});
    const g=box.querySelector("[data-gerar]");
    if(g)g.onclick=()=>lancar(L.filter(x=>!x.p&&x.valor>0).map(x=>x.al),comp);
    box.querySelectorAll("[data-uma]").forEach(b=>b.onclick=()=>lancar([alunaById(b.dataset.uma)],comp));
    box.querySelectorAll("[data-pago]").forEach(b=>b.onclick=async()=>{
      const p=S.pagamentos.find(x=>x.id===b.dataset.pago);
      const forma=prompt("Como recebeu? (pix, dinheiro, cartao, transferencia)","pix");
      if(forma===null)return;
      const f=["pix","dinheiro","cartao","transferencia"].includes(String(forma).toLowerCase().trim())
              ?String(forma).toLowerCase().trim():"outro";
      try{
        const [r]=await db.update("sl_pagamentos",p.id,{pago_em:iso(new Date()),valor_pago:p.valor,forma:f});
        Object.assign(p,r);desenhar();toast("Recebimento registrado.");
      }catch(e){toast(limparErro(e));}
    });
    box.querySelectorAll("[data-desfaz]").forEach(b=>b.onclick=async()=>{
      const p=S.pagamentos.find(x=>x.id===b.dataset.desfaz);
      try{
        const [r]=await db.update("sl_pagamentos",p.id,{pago_em:null,valor_pago:null,forma:null});
        Object.assign(p,r);desenhar();toast("Baixa desfeita.");
      }catch(e){toast(limparErro(e));}
    });
    box.querySelectorAll("[data-cob]").forEach(b=>b.onclick=()=>{
      const x=L.find(y=>y.al.id===b.dataset.cob);
      abrirWhats(x.al.telefone,preencher(S.cfg.msg_cobranca,{
        aluna:x.al.nome.split(" ")[0], mes:MES[ref.getMonth()], valor:fmtBRL(x.valor),
        vencimento:x.venc?x.venc.slice(8,10):(x.al.vencimento||""),
        studio:S.cfg.nome_studio||"Studio Luma Restivo"}));
    });
    const mo=box.querySelector("[data-modelo]");
    if(mo)mo.onclick=()=>modalModeloMsg("msg_cobranca","Mensagem de cobrança",
      ["mes","valor","vencimento","studio"],()=>{alvo?render():(closeModal(),modalRecebimentos());});
    box.querySelector("[data-csv]").onclick=()=>{
      const cab=["Aluna","Professora","Plano","Valor","Vencimento","Situação","Pago em","Forma"];
      const linhas=[cab].concat(L.map(x=>[x.al.nome,x.al.professora?CORES[x.al.professora].nome:"",
        rotuloPlano(x.al.plano),String(x.valor).replace(".",","),x.venc||"",
        x.pago?"pago":(x.atrasado?"atrasado":(x.p?"em aberto":"sem cobrança")),
        x.p&&x.p.pago_em||"",x.p&&x.p.forma||""]));
      const csv="﻿"+linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
      baixar(new Blob([csv],{type:"text/csv;charset=utf-8"}),`recebimentos-${mesISO(ref).slice(0,7)}.csv`);
    };
  }
}

const CINZA_BARRA="#9aa0a6";

/* números do mês de referência */
function apuracao(ref){
  const comp=mesISO(ref),hoje=iso(new Date());
  const passado=comp<mesISO(new Date());   // mês fechado: só o que foi lançado de verdade
  const alunas=minhasAlunas();
  const linhas=alunas.map(al=>{
    const p=S.pagamentos.find(x=>x.aluna_id===al.id&&x.competencia===comp)||null;
    const venc=p?p.vencimento:(al.vencimento?iso(new Date(ref.getFullYear(),ref.getMonth(),
      Math.min(al.vencimento,mesFim(ref).getDate()))):null);
    const valor=p?Number(p.valor):Number(al.valor||0);
    const pago=!!(p&&p.pago_em);
    return {al,p,venc,valor,pago,atrasado:!pago&&venc&&venc<hoje};
  }).filter(x=>passado?!!x.p:(x.valor>0||x.p));
  const previsto=linhas.reduce((s,x)=>s+x.valor,0);
  const recebido=linhas.filter(x=>x.pago).reduce((s,x)=>s+Number(x.p.valor_pago??x.valor),0);
  const atrasado=linhas.filter(x=>x.atrasado).reduce((s,x)=>s+x.valor,0);
  const ativas=alunas.filter(a=>Number(a.valor)>0).length;
  return {linhas,previsto,recebido,aberto:previsto-recebido,atrasado,ativas,
          ticket:ativas?previsto/ativas:0,alunas};
}
/* receita recorrente: soma do valor mensal de quem tem plano vigente */
function mrr(){
  const hoje=iso(new Date());
  return minhasAlunas().filter(a=>Number(a.valor)>0&&(!a.plano_fim||a.plano_fim>=hoje))
                       .reduce((s,a)=>s+Number(a.valor),0);
}
function agrupar(lista,chave){
  const m=new Map();
  lista.forEach(x=>{const k=chave(x)||"—";m.set(k,(m.get(k)||0)+1);});
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}

function modalFinanceiro(alvo){
  let ref=new Date();

  function desenhar(){
    const A=apuracao(ref);
    const R=mrr();
    /* últimos 6 meses: recebido x em aberto (mesma medida, parte-do-todo) */
    const meses=[];
    for(let i=5;i>=0;i--){
      const d=new Date(ref.getFullYear(),ref.getMonth()-i,1),a=apuracao(d);
      meses.push({d,previsto:a.previsto,recebido:a.recebido,aberto:Math.max(0,a.aberto)});
    }
    const teto=Math.max(1,...meses.map(x=>x.previsto));
    const colunas=meses.map(x=>{
      const hR=Math.round(x.recebido/teto*112),hA=Math.round(x.aberto/teto*112);
      return `<div class="c">

        <div class="hint">Os valores saem do cadastro de cada aluna (plano, valor e vencimento) e do que
          você marca como recebido. Nada é cobrado automaticamente.</div>
      </div>
      <div class="modal-f"><button class="btn" data-x>Fechar</button></div>`;
    ligar(A,ref);
  }

  function ligar(A,refAtual){
    const box=document.getElementById("fin");
    box.querySelectorAll("[data-x]").forEach(b=>b.onclick=fechar(alvo));
    box.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{
      ref=new Date(ref.getFullYear(),ref.getMonth()+ +b.dataset.nav,1);desenhar();});
    box.querySelector("[data-rec]").onclick=()=>{S.abaFin="recebimentos";alvo?render():(closeModal(),modalRecebimentos());};
    const tp=box.querySelector("[data-precos]");
    if(tp)tp.onclick=()=>modalPrecos(()=>{alvo?render():(closeModal(),modalFinanceiro());});
    box.querySelectorAll("[data-renov]").forEach(b=>b.onclick=()=>{
      const al=alunaById(b.dataset.renov);
      abrirWhats(al.telefone,preencher(S.cfg.msg_renovacao,{
        aluna:al.nome.split(" ")[0], plano:rotuloDur(al.plano_tipo),
        frequencia:rotuloPlano(al.plano),
        vence:al.plano_fim?al.plano_fim.slice(8,10)+"/"+al.plano_fim.slice(5,7)+"/"+al.plano_fim.slice(0,4):"",
        dias:statusPlano(al).dias, studio:S.cfg.nome_studio||"Studio Luma Restivo"}));
    });
    box.querySelectorAll("[data-renovar]").forEach(b=>b.onclick=()=>modalRenovar(b.dataset.renovar));
    box.querySelectorAll("[data-cobrar]").forEach(b=>b.onclick=()=>{
      const x=A.linhas.find(y=>y.al.id===b.dataset.cobrar);
      abrirWhats(x.al.telefone,preencher(S.cfg.msg_cobranca,{
        aluna:x.al.nome.split(" ")[0], mes:MES[refAtual.getMonth()], valor:fmtBRL(x.valor),
        vencimento:x.venc?x.venc.slice(8,10):"", studio:S.cfg.nome_studio||"Studio Luma Restivo"}));
    });
  }
}

/* =====================================================================

   ===================================================================== */
function modalRenovar(id){
  const al=alunaById(id);if(!al)return;
  const base=al.plano_fim?iso(addDays(parseISO(al.plano_fim),1)):iso(new Date());
  const m=openModal(`<div class="modal">
    <div class="modal-top">
      <button class="ico-btn" data-x><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <h3>Renovar o plano de ${esc(al.nome.split(" ")[0])}</h3>
    </div>
    <div class="modal-b">
      <div class="aviso" style="margin-bottom:16px">
        Plano atual: <b>${rotuloDur(al.plano_tipo)||"—"} ${rotuloPlano(al.plano)||""}</b>
        ${al.plano_fim?` · terminou/termina em <b>${al.plano_fim.slice(8,10)}/${al.plano_fim.slice(5,7)}/${al.plano_fim.slice(0,4)}</b>`:""}
        ${al.valor?` · ${fmtBRL(al.valor)}/mês`:""}
      </div>
      <div class="row3">
        <div class="fld"><label>Frequência</label><select id="r_plano">
          ${PLANOS.map(x=>`<option value="${x}"${al.plano===x?" selected":""}>${rotuloPlano(x)}</option>`).join("")}
        </select></div>
        <div class="fld"><label>Duração</label><select id="r_dur">
          ${DURACOES.map(d=>`<option value="${d[0]}"${al.plano_tipo===d[0]?" selected":""}>${d[1]}</option>`).join("")}
        </select></div>
        <div class="fld"><label>Novo início</label><input id="r_ini" type="date" value="${base}"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>Valor por mês (R$)</label>
          <input id="r_valor" type="number" step="0.01" min="0" value="${al.valor??""}"></div>
        <div class="fld"><label>Forma de pagamento</label><select id="r_forma">
          <option value="">—</option>${FORMAS.map(f=>`<option value="${f[0]}"${al.forma_pagamento===f[0]?" selected":""}>${f[1]}</option>`).join("")}
        </select></div>
      </div>
      <div class="aviso" id="r_resumo"></div>
      <div class="hint">O plano anterior fica guardado no histórico ${gen(al,"da aluna","do aluno")}.</div>
    </div>
    <div class="modal-f">
      <button class="btn" data-x>Cancelar</button>
      <button class="btn pri" data-ok>Confirmar renovação</button>
    </div>
  </div>`);
  const g=i=>m.querySelector("#r_"+i);
  const prev=(auto)=>{
    if(auto){const pr=precoTabela(g("dur").value,g("plano").value);if(pr!=null)g("valor").value=pr;}
    const meses=mesesDo(g("dur").value),fim=fimDoPlano(g("ini").value,g("dur").value),v=parseFloat(g("valor").value);
    const p=[`<b>${rotuloDur(g("dur").value)} · ${rotuloPlano(g("plano").value)}</b>`];
    if(isFinite(v)&&v>0){p.push(`${fmtBRL(v)} por mês`);if(meses>1)p.push(`total <b>${fmtBRL(v*meses)}</b> em ${meses}x`);}
    if(fim)p.push(`novo período: <b>${g("ini").value.slice(8,10)}/${g("ini").value.slice(5,7)}</b> até <b>${fim.slice(8,10)}/${fim.slice(5,7)}/${fim.slice(0,4)}</b>`);
    g("resumo").innerHTML=p.join(" · ");
  };
  ["plano","dur"].forEach(i=>g(i).onchange=()=>prev(true));
  ["ini","valor"].forEach(i=>g(i).oninput=()=>prev(false));
  prev(false);
  m.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  m.querySelector("[data-ok]").onclick=async()=>{
    const v=parseFloat(g("valor").value);
    try{
      if(al.plano_inicio) await db.insert("sl_renovacoes",{aluna_id:al.id,de:al.plano_inicio,ate:al.plano_fim,
        plano_tipo:al.plano_tipo,frequencia:al.plano,valor:al.valor});
      const [r]=await db.update("sl_alunas",al.id,{
        plano:g("plano").value||null, plano_tipo:g("dur").value||null,
        plano_inicio:g("ini").value||null, valor:isFinite(v)?v:null,
        forma_pagamento:g("forma").value||null});
      Object.assign(al,r);closeModal();render();
      toast(`Plano ${gen(al,"renovada","renovado")} até ${r.plano_fim?r.plano_fim.slice(8,10)+"/"+r.plano_fim.slice(5,7):"—"}.`);
    }catch(e){toast(limparErro(e));}
  };
}

/* mensalidades da professora numa competência, separando parceiro (Wellhub/TotalPass) */
function baseComissao(slug,ref){
  const comp=mesISO(ref);
  const linhas=S.alunas.filter(a=>a.professora===slug).map(al=>{
    const p=S.pagamentos.find(x=>x.aluna_id===al.id&&x.competencia===comp);
    const valor=p?Number(p.valor):Number(al.valor||0);
    return {al,valor,parceiro:PARCEIROS.includes(al.forma_pagamento)};
  }).filter(x=>x.valor>0);
  return {
    diretos :linhas.filter(x=>!x.parceiro),
    parceiro:linhas.filter(x=> x.parceiro),
    somaDiretos :linhas.filter(x=>!x.parceiro).reduce((s,x)=>s+x.valor,0),
    somaParceiro:linhas.filter(x=> x.parceiro).reduce((s,x)=>s+x.valor,0)
  };
}
function calcularRepasse(slug,ref){
  const defas=parseInt(S.cfg.mes_defasagem_parceiro||"1",10);
  const anterior=new Date(ref.getFullYear(),ref.getMonth()-defas,1);
  const r=repasseDe(slug),pct=Number(r.pct_comissao)/100;
  const mes=baseComissao(slug,ref),ant=baseComissao(slug,anterior);
  const fixo=Number(r.valor_fixo||0);
  const comis=mes.somaDiretos*pct;
  const parc =ant.somaParceiro*pct;          // parceiro entra com 1 mês de atraso
  return {fixo,comis,parc,total:fixo+comis+parc,pct:r.pct_comissao,
          mes,ant,anterior,qtdDiretos:mes.diretos.length,qtdParc:ant.parceiro.length};
}

VIEWS.contas=function(head,mod){
  if(!S.isLuma){S.modulo="inicio";return render();}
  let ref=S.refContas?new Date(S.refContas):new Date();
  head.innerHTML=btnMenu()+`<div><h1>Contas a pagar</h1>
    <div class="sub">Quanto sai para cada professora</div></div><div class="spacer"></div>
    <button class="btn sm" id="ct_regras">Regras de repasse</button>`;
  mod.innerHTML='<div class="rolar viz" id="dest"></div>';
  head.querySelector("#ct_regras").onclick=()=>modalRegrasRepasse();
  desenhar();

  function desenhar(){
    S.refContas=iso(ref);
    const linhas=SLUGS.map(sl=>({sl,c:calcularRepasse(sl,ref),
      pg:S.pagProf.find(x=>x.professora===sl&&x.competencia===mesISO(ref))}));
    const total=linhas.reduce((s,x)=>s+x.c.total,0);
    const pago =linhas.filter(x=>x.pg&&x.pg.pago_em).reduce((s,x)=>s+Number(x.pg.total),0);
    const receita=apuracao(ref).previsto;
    const d=document.getElementById("dest");
    d.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
        <button class="ico-btn" data-nav="-1"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <b style="flex:1;text-align:center;font-size:15px;font-weight:500">${nomeMes(ref)}</b>
        <button class="ico-btn" data-nav="1"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="kpis">
        <div class="kpi"><b>${fmtBRL(total)}</b><span>a pagar no mês</span></div>
        <div class="kpi"><b style="color:var(--good)">${fmtBRL(pago)}</b><span>já pago</span></div>
        <div class="kpi"><b style="color:var(--warning)">${fmtBRL(total-pago)}</b><span>em aberto</span></div>
        <div class="kpi"><b>${receita>0?Math.round(total/receita*100):0}%</b><span>da receita prevista</span></div>
      </div>
      <div class="aviso">Wellhub e TotalPass entram com <b>um mês de atraso</b>: os check-ins de
        ${nomeMes(ref.getMonth()?new Date(ref.getFullYear(),ref.getMonth()-1,1):new Date(ref.getFullYear()-1,11,1)).split(" de ")[0].toLowerCase()}
        são pagos em ${nomeMes(ref).split(" de ")[0].toLowerCase()}.</div>
      <div class="prev-wrap" style="max-height:none"><table class="prev">
        <thead><tr><th>Professora</th><th>Fixo</th><th>Comissão</th><th>Wellhub/TotalPass</th>
          <th>Total</th><th>Situação</th><th style="width:150px"></th></tr></thead>
        <tbody>${linhas.map(({sl,c,pg})=>{
          const cor=CORES[sl];
          return `<tr>
            <td><b style="color:${cor.cor}">${cor.nome}</b>
              <div style="font-size:10.5px;color:var(--muted)">${c.qtdDiretos} aluno(s) · ${c.pct}% de comissão</div></td>
            <td>${fmtBRL(c.fixo)}</td>
            <td>${fmtBRL(c.comis)}</td>
            <td>${fmtBRL(c.parc)}<div style="font-size:10.5px;color:var(--muted)">${c.qtdParc} aluno(s)</div></td>
            <td><b>${fmtBRL(c.total)}</b></td>
            <td>${pg&&pg.pago_em?`<span class="st nova">pago ${pg.pago_em.slice(8,10)}/${pg.pago_em.slice(5,7)}</span>`
                                 :'<span class="st dupl">a pagar</span>'}</td>
            <td>${pg&&pg.pago_em?`<button class="mini-act" data-desf="${pg.id}" title="Desfazer">↺</button>`
                                 :`<button class="btn sm pri" data-pagar="${sl}" ${c.total>0?"":"disabled"}>Paguei</button>`}
                <button class="btn sm" data-det="${sl}">Detalhe</button></td>
          </tr>`;}).join("")}</tbody>
      </table></div>
      <div class="hint">A comissão incide sobre a mensalidade de cada aluno da carteira da professora.
        O valor fixo e o percentual ficam em <b>Regras de repasse</b>.</div>`;

    d.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{
      ref=new Date(ref.getFullYear(),ref.getMonth()+ +b.dataset.nav,1);desenhar();});
    d.querySelectorAll("[data-det]").forEach(b=>b.onclick=()=>modalDetalheRepasse(b.dataset.det,ref));
    d.querySelectorAll("[data-pagar]").forEach(b=>b.onclick=async()=>{
      const sl=b.dataset.pagar,c=calcularRepasse(sl,ref);
      if(!confirm(`Registrar o pagamento de ${fmtBRL(c.total)} para ${CORES[sl].nome}?`))return;
      try{
        const [r]=await db.insert("sl_pagamentos_prof",{professora:sl,competencia:mesISO(ref),
          valor_fixo:c.fixo,valor_comis:c.comis,valor_parceiro:c.parc,total:c.total,pago_em:iso(new Date())});
        S.pagProf.push(r);desenhar();toast("Pagamento registrado.");
      }catch(e){toast(limparErro(e));}
    });
    d.querySelectorAll("[data-desf]").forEach(b=>b.onclick=async()=>{
      try{
        await db.remove("sl_pagamentos_prof",b.dataset.desf);
        S.pagProf=S.pagProf.filter(x=>x.id!==b.dataset.desf);desenhar();toast("Pagamento desfeito.");
      }catch(e){toast(limparErro(e));}
    });
  }
};

function modalDetalheRepasse(slug,ref){
  const c=calcularRepasse(slug,ref),cor=CORES[slug];
  const linha=(x)=>`<div class="lm"><span class="nm">${esc(x.al.nome)}</span>
    <span style="font-weight:600;font-size:11.5px">${fmtBRL(x.valor)}</span></div>`;
  openModal(`<div class="modal">
    <div class="det-bar" style="background:${cor.cor}"></div>
    <div class="modal-top" style="border:0"><div style="flex:1"></div>
      <button class="ico-btn" onclick="closeModal()"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <div class="det-h"><h2>${cor.nome} · ${nomeMes(ref)}</h2>
      <div class="sub">${c.pct}% de comissão${c.fixo?` + fixo de ${fmtBRL(c.fixo)}`:""}</div></div>
    <div class="det-s">
      <h4>Mensalidades do mês (${fmtBRL(c.mes.somaDiretos)})</h4>
      ${c.mes.diretos.length?`<div class="lista-mini">${c.mes.diretos.map(linha).join("")}</div>`
        :'<div style="font-size:12.5px;color:var(--muted)">Nenhuma mensalidade direta.</div>'}
      <h4>Wellhub / TotalPass de ${nomeMes(c.anterior)} (${fmtBRL(c.ant.somaParceiro)})</h4>
      ${c.ant.parceiro.length?`<div class="lista-mini">${c.ant.parceiro.map(linha).join("")}</div>`
        :'<div style="font-size:12.5px;color:var(--muted)">Nenhum aluno de parceiro no mês anterior.</div>'}
      <h4>Conta</h4>
      <div style="font-size:13px;line-height:2">
        Fixo <b style="float:right">${fmtBRL(c.fixo)}</b><br>
        ${c.pct}% de ${fmtBRL(c.mes.somaDiretos)} <b style="float:right">${fmtBRL(c.comis)}</b><br>
        ${c.pct}% de ${fmtBRL(c.ant.somaParceiro)} (parceiros) <b style="float:right">${fmtBRL(c.parc)}</b><br>
        <div style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px">
          <b>Total</b> <b style="float:right;color:${cor.cor}">${fmtBRL(c.total)}</b></div>
      </div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Fechar</button></div>
  </div>`);
}

function modalRegrasRepasse(){
  const m=openModal(`<div class="modal">
    <div class="modal-top">
      <button class="ico-btn" data-x><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <h3>Regras de repasse</h3>
    </div>
    <div class="modal-b">
      <p style="font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.6">
        Quanto cada professora recebe: um valor fixo por mês (se houver) mais um percentual
        sobre a mensalidade dos alunos da carteira dela.</p>
      <div class="prev-wrap" style="max-height:none"><table class="prev">
        <thead><tr><th>Professora</th><th>Valor fixo (R$)</th><th>Comissão (%)</th></tr></thead>
        <tbody>${SLUGS.map(sl=>{const r=repasseDe(sl);return `<tr>
          <td><b style="color:${CORES[sl].cor}">${CORES[sl].nome}</b></td>
          <td><input id="rp_f_${sl}" type="number" min="0" step="0.01" value="${Number(r.valor_fixo)||0}"
              style="width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:6px"></td>
          <td><input id="rp_c_${sl}" type="number" min="0" max="100" step="1" value="${Number(r.pct_comissao)}"
              style="width:88px;padding:6px 8px;border:1px solid var(--line);border-radius:6px"></td>
        </tr>`;}).join("")}</tbody></table></div>
      <div class="fld" style="margin-top:16px"><label>Wellhub/TotalPass entram com quantos meses de atraso</label>
        <input id="rp_defas" type="number" min="0" max="6" value="${esc(S.cfg.mes_defasagem_parceiro||"1")}" style="width:100px"></div>
      <div class="hint">Com 1 mês: os alunos de parceiro de agosto entram no pagamento de setembro.</div>
    </div>
    <div class="modal-f">
      <button class="btn" data-x>Cancelar</button>
      <button class="btn pri" data-save>Salvar</button>
    </div>
  </div>`);
  m.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeModal);
  m.querySelector("[data-save]").onclick=async()=>{
    try{
      for(const sl of SLUGS){
        const f=parseFloat(m.querySelector("#rp_f_"+sl).value)||0;
        const c=parseFloat(m.querySelector("#rp_c_"+sl).value);
        await req("sl_repasses",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=representation"},
          body:JSON.stringify({professora:sl,valor_fixo:f,pct_comissao:isFinite(c)?c:50,atualizado:new Date().toISOString()})});
      }
      const d=parseInt(m.querySelector("#rp_defas").value,10);
      if(isFinite(d)&&d>=0)await salvarConfig("mes_defasagem_parceiro",String(d));
      await loadAll();closeModal();render();toast("Regras salvas.");
    }catch(e){toast(limparErro(e));}
  };
}

/* ---------- start ---------- */
initLock();
</script>
